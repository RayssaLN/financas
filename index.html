:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg,#f5f3f7);font-family:"Figtree",system-ui,sans-serif}
#login .box{max-width:360px;width:100%;text-align:center}

<script>
/* ===== Conexão com o Firebase: login com Google + dados em users/{seu id}/... ===== */
(function(){
  const cfgOk = window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/COLE_AQUI/.test(window.FIREBASE_CONFIG.apiKey);
  function loginScreen(msg){
    let el=document.getElementById('login');
    if(!el){ el=document.createElement('div'); el.id='login'; document.body.appendChild(el); }
    el.innerHTML='<div class="box"><svg width="64" height="64" viewBox="0 0 40 40"><defs><linearGradient id="lgx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b3f8c"/><stop offset="1" stop-color="#d8577e"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lgx)"/><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5v13M17 13.5l-9 7.5M11.6 18.3l5.8 8.2"/><path d="M21.5 26.5v-13h5a3.5 3.5 0 0 1 0 7h-5M26.2 20.5l4.6 6"/></g><path d="M33 4.8l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1z" fill="#fff"/></svg>'
      +'<h1>Finanças</h1><p>'+(cfgOk?'Entre com a sua conta Google para ver suas finanças.':'Falta configurar o Firebase: preencha o arquivo firebase-config.js (veja o LEIA-ME).')+'</p>'
      +(cfgOk?'<button id="btn-google"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</button>':'')
      +(msg?'<div class="err">'+msg+'</div>':'')+'</div>';
    const b=document.getElementById('btn-google');
    if(b) b.onclick=()=>{ const p=new firebase.auth.GoogleAuthProvider(); firebase.auth().signInWithPopup(p).catch(e=>{ if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') firebase.auth().signInWithRedirect(p); else loginScreen('Não consegui entrar: '+(e.message||e.code)); }); };
  }
  function adapterRoot(root){
    const snap=s=>({id:s.id,exists:s.exists,data:()=>s.data()});
    return {
      collection:name=>{ const c=root.collection(name); return {
        onSnapshot:(next,err)=>c.onSnapshot(q=>next({docs:q.docs.map(snap)}),err),
        doc:id=>({ set:d=>c.doc(id).set(d), delete:()=>c.doc(id).delete() }) }; },
      doc:path=>{ const [c,id]=path.split('/'); const r=root.collection(c).doc(id); return {
        onSnapshot:(next,err)=>r.onSnapshot(s=>next(snap(s)),err), set:d=>r.set(d), delete:()=>r.delete() }; }
    };
  }
  const fs=()=>firebase.firestore();
  const userDoc=uid=>fs().collection('users').doc(uid);
  let ME=null;
  window.__getDb = () => new Promise(resolve=>{
    if(!cfgOk){ loginScreen(); return; }
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fs().enablePersistence({synchronizeTabs:true}).catch(()=>{});
    let started=false;
    firebase.auth().onAuthStateChanged(async u=>{
      if(!u){ if(started) location.reload(); else loginScreen(); return; }
      const el=document.getElementById('login'); if(el) el.remove();
      if(started) return; started=true;
      ME={uid:u.uid, nome:(u.displayName||'').split(' ')[0]||'Eu'};
      try{ const p=await userDoc(u.uid).collection('perfil').doc('info').get(); if(!p.exists||!p.data().nome) await userDoc(u.uid).collection('perfil').doc('info').set({nome:ME.nome},{merge:true}); else ME.nome=p.data().nome; }catch(e){}
      resolve(adapterRoot(userDoc(u.uid)));
    });
  });
  /* ---- casal: convite, vínculo e dados compartilhados ---- */
  const ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const novoCodigo=()=>Array.from(crypto.getRandomValues(new Uint32Array(10)),n=>ALF[n%ALF.length]).join('');
  window.__couple = {
    get me(){ return ME; },
    dbFor: uid => adapterRoot(userDoc(uid)),
    casalDb: cid => adapterRoot(fs().collection('casais').doc(cid)),
    onCasal(cb){
      let unCasal=null, cur=null;
      userDoc(ME.uid).collection('perfil').doc('info').onSnapshot(s=>{
        const cid=s.exists?s.data().casalId:null; if(s.exists&&s.data().nome) ME.nome=s.data().nome;
        if(cid===cur) return; cur=cid; if(unCasal){ unCasal(); unCasal=null; }
        if(!cid){ cb(null); return; }
        unCasal=fs().collection('casais').doc(cid).onSnapshot(d=>{
          const x=d.exists?d.data():null;
          if(!x||!(x.membros||[]).includes(ME.uid)){ cb(null); return; }
          cb({cid, membros:x.membros||[], nomes:x.nomes||{}});
        }, ()=>cb(null));
      }, ()=>cb(null));
    },
    async criar(nome){
      const cid=novoCodigo();
      await fs().collection('casais').doc(cid).set({membros:[ME.uid], nomes:{[ME.uid]:nome||ME.nome}, criadoEm:new Date().toISOString()});
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:cid, nome:nome||ME.nome},{merge:true});
      return cid;
    },
    async entrar(cid,nome){
      await fs().collection('casais').doc(cid).update({membros:firebase.firestore.FieldValue.arrayUnion(ME.uid), ['nomes.'+ME.uid]:nome||ME.nome});
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:cid, nome:nome||ME.nome},{merge:true});
    },
    async sair(cid){
      try{ await fs().collection('casais').doc(cid).update({membros:firebase.firestore.FieldValue.arrayRemove(ME.uid), ['nomes.'+ME.uid]:firebase.firestore.FieldValue.delete()}); }catch(e){}
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:firebase.firestore.FieldValue.delete()},{merge:true});
    }
  };
  window.__logout = () => firebase.auth().signOut();
  window.__saveFile = async (name, txt) => {
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); return {status:'saved'};
  };
})();
</script>
<title>Finanças</title>
</head>

<style>
:root{
  color-scheme: light;
  --bg:#f4f3ec; --surface:#ffffff; --surface-2:#eeede4; --ink:#14261e; --ink-2:#4b5a52; --muted:#86918a;
  --line:rgba(30,26,36,.10); --line-2:rgba(30,26,36,.18);
  --accent:#1f7a4f; --accent-ink:#ffffff; --accent-soft:#e2f1e8; --gold:#c98a14; --gold-soft:#faefd6;
  --good:#1f7a4f; --bad:#c2412f; --bad-soft:#fbe6e1;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#2f8f2f; --c7:#4a3aa7; --c8:#e34948;
  --shadow:0 1px 2px rgba(30,26,36,.05), 0 6px 20px rgba(30,26,36,.05);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1612; --surface:#15211b; --surface-2:#1c2b23; --ink:#eef2ec; --ink-2:#b6c2ba; --muted:#7f8c84;
    --line:rgba(238,242,236,.09); --line-2:rgba(238,242,236,.18);
    --accent:#4bbf8d; --accent-ink:#0b1a12; --accent-soft:rgba(75,191,141,.14); --gold:#e6b455; --gold-soft:rgba(230,180,85,.14);
    --good:#5fcf9b; --bad:#ef7a66; --bad-soft:rgba(239,122,102,.14);
    --c1:#4b95ec; --c2:#f07c4c; --c3:#2fc28c; --c4:#e3a91f; --c5:#e58bb0; --c6:#52b152; --c7:#9085e9; --c8:#ef6f6e;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1612; --surface:#15211b; --surface-2:#1c2b23; --ink:#eef2ec; --ink-2:#b6c2ba; --muted:#7f8c84;
  --line:rgba(238,242,236,.09); --line-2:rgba(238,242,236,.18);
  --accent:#4bbf8d; --accent-ink:#0b1a12; --accent-soft:rgba(75,191,141,.14); --gold:#e6b455; --gold-soft:rgba(230,180,85,.14);
  --good:#5fcf9b; --bad:#ef7a66; --bad-soft:rgba(239,122,102,.14);
  --c1:#4b95ec; --c2:#f07c4c; --c3:#2fc28c; --c4:#e3a91f; --c5:#e58bb0; --c6:#52b152; --c7:#9085e9; --c8:#ef6f6e;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:36px;height:36px;flex:none}
.brand .spark{transform-origin:33px 8.1px;animation:spark 3.2s ease-in-out infinite}
@keyframes spark{0%,70%,100%{transform:scale(1);opacity:1}80%{transform:scale(1.5) rotate(45deg);opacity:.7}}
.brand b{font-family:var(--display);font-size:1.12rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:500}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:0 0 4px;padding:0 10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;color:var(--ink-2);font-weight:500;font-size:.92rem}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.off i{background:var(--bad)}

main{padding:28px 32px 110px;max-width:1120px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:0 0 4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.15rem);letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.08rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:6px 0 0;font-size:.92rem}

.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthpick button{border:0;background:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.monthpick button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.monthpick button:disabled{opacity:.3;cursor:default}
.monthpick span{min-width:128px;text-align:center;font-weight:600;font-size:.92rem}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:14px}
.section{margin-top:14px}

.stat .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stat .val{font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .val.sm{font-size:1.3rem}
.stat .ft{font-size:.8rem;color:var(--ink-2);margin-top:4px}
.stat.hero{background:var(--ink);color:var(--bg);border-color:transparent}
.stat.hero .lbl,.stat.hero .ft{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.stat.hero .pos{color:#8fe0b8} .stat.hero .neg{color:#ffab9b}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--bad)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
.muted{color:var(--muted)}
.cell-input{width:100%;min-width:84px;max-width:120px;text-align:right;border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 6px;font-variant-numeric:tabular-nums}
.cell-input:hover{border-color:var(--line-2)}
.cell-input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.cell-name{max-width:none;text-align:left;min-width:120px}

/* category blocks */
.cat{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cat-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2)}
.cat-h b{font-weight:700;font-size:.9rem;flex:1}
.cat-h .num{font-weight:600;font-size:.88rem}
.cat table td,.cat table th{padding-left:14px;padding-right:10px}
.cat .add{padding:6px 10px;border-top:1px solid var(--line)}
.cat table td:first-child,.stat table td:first-child{width:100%}
.cat .cell-input{min-width:84px;max-width:104px;padding:4px 4px}
.stat table .cell-input{min-width:70px;max-width:92px;padding:4px 2px;font-size:.82rem}

function save(col, id, data){
  if (readonlyView()) { toast('Você está vendo a tela de '+nomeParceiro()+'. Só '+nomeParceiro()+' pode alterar.'); render(); return; }
  // optimistic local update
  if (col==='orcamento') S.orc[id]=data;
  else if (col==='cartao') S.cartao[id]=data;
  else if (col==='potes') S.potes[id]=data;
  else if (col==='config') S.config=data;
  else if (col==='meliuz') S.meliuz=data;
  else if (col==='cartaoinfo') S.cinfo=data;
  else if (col==='proventos') S.prov=data;
  render();
  if (!db) { toast('Sem conexão com o armazenamento: esta alteração não foi salva'); return; }
  const key = col+'/'+id;
  queues[key] = (queues[key]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))).catch(e=>{
    if (e && e.code==='invalid_argument') { readonly=true; toast('Você só pode visualizar este app'); }
    else toast('Não consegui salvar. Tente de novo em instantes.');
  });
}

}

  UI.month=null; render();

  const done = new Set();
  const mark = k => { if(!done.has(k)){ done.add(k); S.ready=done.size; if(S.ready>=8){ pickMonth(); } } render(); };
  const onErr = () => { sync.classList.add('off'); sync.lastElementChild.textContent='Conexão perdida'; };
  const col=(n,f,k)=>unsubs.push(src.collection(n).onSnapshot(sn=>{ const o={}; sn.docs.forEach(d=>o[d.id]=d.data()); f(o); mark(k); }, onErr));
  const doc=(p,f,k)=>unsubs.push(src.doc(p).onSnapshot(d=>{ if(d.exists) f(d.data()); mark(k); }, onErr));
  col('orcamento',o=>S.orc=o,'o'); col('cartao',o=>S.cartao=o,'c'); col('potes',o=>S.potes=o,'p');
  doc('config/geral',d=>{ S.config=Object.assign({reservaMeses:6,cartoes:['Nubank','MP','C6']},d); if(S.config.paleta && !readonlyView()) applyPal(S.config.paleta); renderNav(); },'g');
  doc('meliuz/registro',d=>S.meliuz=Object.assign({itens:[]},d),'m');

}

  const byCat={}; CATS.forEach(c=>byCat[c.k]={prev:0,real:0});

  return {renda:+o.renda||0, rendaPrev:+o.rendaPrevista||0, desp, despPrev, saldo:(+o.renda||0)-desp, saldoPrev:(+o.rendaPrevista||0)-despPrev, byCat};

/* ================= charts ================= */
function barChart({labels, series, h=200, fmtY=fmtK, stacked=false}){
  const W=640, H=h, pl=52, pr=8, pt=12, pb=26;
  const n=labels.length; if(!n) return '<p class="muted">Sem dados ainda.</p>';
  const totals = labels.map((_,i)=> stacked ? sum(series,s=>Math.max(0,s.values[i])) : Math.max(...series.map(s=>s.values[i]||0)));
  let max = Math.max(1,...totals); const step = niceStep(max/4); max = Math.ceil(max/step)*step;
  const y = v => pt + (H-pt-pb)*(1 - v/max);
  const bw = (W-pl-pr)/n; const inner = Math.min(bw*0.72, stacked?34:44);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=0; v<=max+0.001; v+=step){ out+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${esc(fmtY(v))}</text>`; }
  labels.forEach((lb,i)=>{
    const cx = pl + bw*i + bw/2;
    if(stacked){
      let acc=0;
      series.forEach(s=>{ const v=Math.max(0,s.values[i]||0); if(!v) return; const y1=y(acc+v), y0=y(acc); out+=`<rect x="${cx-inner/2}" y="${y1}" width="${inner}" height="${Math.max(0,y0-y1-1)}" rx="2" fill="${s.color}" data-tip="${esc(lb)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`; acc+=v; });
    } else {
      const k=series.length, w=inner/k;
      series.forEach((s,j)=>{ const v=s.values[i]||0; const x=cx-inner/2+j*w; out+=`<rect x="${x+1}" y="${y(Math.max(0,v))}" width="${Math.max(2,w-2)}" height="${Math.max(0,y(0)-y(Math.max(0,v)))}" rx="3" fill="${s.color}" data-tip="${esc(lb)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`; });
    }
    out+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return out+'</svg>';
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1)))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function legend(series){ return '<div class="legend">'+series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')+'</div>'; }
function ring(p, big, small){
  const r=62, c=2*Math.PI*r, v=Math.max(0,Math.min(1,p));
  return `<svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="76" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${esc(big)}</text><text x="75" y="98" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(small)}</text></svg>`;
}

function resumoAno(){

const semAcento = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function grupoInvest(it){
  if (it.grupo) return it.grupo;
  const n=semAcento(it.nome);
  const p=potesList().find(p=>{ const pn=semAcento(p.nome); return pn===n || pn.startsWith(n) || n.startsWith(pn.split(' ')[0]); });

  return 'longo';
}
function investCard(o,t){

const FONTES_PADRAO=['Renda','Saldo anterior','Renda extra','Benefício','Transferência'];
function fontesRenda(){ return (S.config.fontesRenda&&S.config.fontesRenda.length)?S.config.fontesRenda:FONTES_PADRAO; }
function mapFonte(nome){ const fs=fontesRenda(), n=semAcento(nome); const ach=re=>fs.find(f=>re.test(semAcento(f)));
  return fs.find(f=>semAcento(f)===n) || (/extra/.test(n)&&ach(/extra/)) || (/benef|vale|\bvr\b|\bva\b|alelo/.test(n)&&ach(/benef/)) || (/transf|pix/.test(n)&&ach(/transf/)) || (/renda|salario|lwm/.test(n)&&ach(/^renda$/)) || (/sobra|saldo/.test(n)&&ach(/saldo/)) || nome; }
function rendaMes(o){
  if(o.recebidos||o.previstas) return {prev:{...(o.previstas||{})}, rec:[...(o.recebidos||[])]};
  const prev={}, rec=[];
  (o.rendas||[]).forEach(r=>{ const f=mapFonte(r.nome); prev[f]=r2((prev[f]||0)+(+r.previsto||0)); if(+r.real) rec.push({id:'ant-'+semAcento(r.nome).replace(/[^a-z0-9]/g,''),data:(o.mes||UI.month)+'-01',fonte:f,valor:r2(r.real),desc:r.nome}); });

  return {prev,rec};
}
function gravarRenda(o,rm){ o.previstas=rm.prev; o.recebidos=rm.rec; delete o.rendas; o.renda=r2(sum(rm.rec,x=>x.valor)); o.rendaPrevista=r2(sum(Object.values(rm.prev),v=>v)); return o; }
function addRecebido(o,fonte,valor,data,desc){ const rm=rendaMes(o); rm.rec.push({id:uid('r'),data,fonte,valor:r2(valor),desc:desc||''}); return gravarRenda(o,rm); }
function previstasDoMesAnterior(from){ if(!from) return {}; const rm=rendaMes(from); const out={}; [...new Set([...Object.keys(rm.prev),...rm.rec.map(r=>r.fonte)])].forEach(f=>{ const rec=sum(rm.rec.filter(r=>r.fonte===f),r=>r.valor); const v=f==='Saldo anterior'?0:(rec||rm.prev[f]||0); if(v) out[f]=r2(v); }); return out; }

</div>

const parcRest = p => p.valores.slice(p.pagas);
/* Cada parcela tem a fatura da 1ª parcela (inicio) e, se for o caso, meses com mais de uma parcela juntas */
function parcBase(p){
  if(p.inicio) return {inicio:p.inicio, juntas:p.juntas||{}};
  // dados antigos: a "próxima parcela" (índice pagas) é a fatura do mês atual
  const A=thisMonth(), j={...(p.juntas||{})}; if(+p.proxQtd>1 && p.pagas<p.valores.length) j[A]=+p.proxQtd;
  return {inicio:addMonth(A,-(+p.pagas||0)), juntas:j};
}
function parcMeses(p){ const b=parcBase(p), n=p.valores.length, out=[]; let c=b.inicio, guarda=0; while(out.length<n && guarda++<600){ const j=b.juntas[c]; const q= j===undefined ? 1 : Math.max(0,+j||0); for(let k=0;k<q&&out.length<n;k++) out.push(c); c=addMonth(c,1); } return out; }
function migrarParcelas(){
  if(readonlyView() || VIEW_DB!==db) return;
  const ps=S.cinfo.parcelas||[]; if(!ps.some(p=>!p.inicio)) return;
  const lst=ps.map(p=>{ if(p.inicio) return p; const b=parcBase(p); const q={...p,inicio:b.inicio}; if(Object.keys(b.juntas).length) q.juntas=b.juntas; delete q.proxQtd; return q; });
  save('cartaoinfo','geral',{...S.cinfo,parcelas:lst});
}
/* Em qual fatura (mês de vencimento) cai uma compra feita na data iso, conforme o fechamento do cartão */
function cartaoDatas(card){ const c=(S.config.fechamento||{})[card]; return c&&+c.fecha?{fecha:+c.fecha,vence:+c.vence||0}:null; }
function faturaMes(card, iso){
  const m=String(iso||todayISO()).slice(0,7), day=+String(iso||todayISO()).slice(8,10)||1, cf=cartaoDatas(card);
  if(!cf) return addMonth(m,1);
  const fech = day < cf.fecha ? m : addMonth(m,1);          // mês em que essa fatura fecha
  return (cf.vence && cf.vence <= cf.fecha) ? addMonth(fech,1) : fech;  // vence no mesmo mês ou no seguinte
}
function cartoesFatura(){ return [...new Set([...(S.cinfo.parcelas||[]).map(p=>p.cartao),...(S.cinfo.contas||[]).map(c=>c.cartao)])]; }
function projecao(n){
  // n faturas a partir da do mês atual: parcelas + contas no cartão + compras à vista + estornos
  const start=thisMonth(); const ms=Array.from({length:n},(_,i)=>addMonth(start,i));
  const cards=[...new Set([...cartoesFatura(),...[addMonth(start,-1),start].flatMap(mk=>(S.cartao[mk]?.compras||[]).map(c=>c.cartao))])];
  const by={}; cards.forEach(c=>by[c]=ms.map(m=>composicaoFatura(c,m).tot));
  return {ms,by,cards};
}
function composicaoFatura(card,F){
  // fatura que vence no mês F = parcelas daquele mês + contas no cartão + compras à vista do mês anterior + estornos
  F=F||thisMonth(); const it=[];
  const fora=((S.cinfo.fora||{})[F])||[];
  (S.cinfo.parcelas||[]).filter(p=>p.cartao===card).forEach(p=>{ const pm=parcMeses(p), n=p.valores.length; const jb=parcBase(p).juntas; let veio=jb[addMonth(F,-1)]===0; pm.forEach((m,i)=>{ if(m===F){ it.push({t:'Parcela',d:`${p.desc} ${i+1}/${n}`,v:p.valores[i],pid:p.id,veio}); veio=false; } }); });
  (S.cinfo.contas||[]).filter(c=>c.cartao===card&&!c.parcelaId&&(!c.desde||F>=c.desde)&&!compraDaConta(c,F)).forEach(c=>it.push({t:'Conta',d:c.desc,v:fora.includes(c.id)?0:(+c.valor||0),cid:c.id,fora:fora.includes(c.id)}));
  [addMonth(F,-3),addMonth(F,-2),addMonth(F,-1),F].forEach(mk=>(S.cartao[mk]?.compras||[]).filter(c=>c.cartao===card&&!c.parcela&&(c.fatura||faturaMes(card,c.data))===F).forEach(c=>it.push({t:'Compra',d:c.desc+' · '+c.data.slice(8,10)+'/'+c.data.slice(5,7),v:+c.valor||0,compra:c.id,mk,movida:!!c.fatura&&c.fatura!==faturaMes(card,c.data)})));
  (S.cinfo.creditos||[]).filter(c=>c.cartao===card&&c.mes===F).forEach(c=>it.push({t:'Estorno',d:c.desc,v:-(+c.valor||0),id:c.id}));
  return {it,tot:r2(sum(it,x=>x.v))};
}

/* rendimentos: fontes por mês */
function rendFontes(){
  // devolve {mes: {fonte: valor}} e a lista de fontes
  const out={}; const add=(m,f,v)=>{ if(!v) return; (out[m]=out[m]||{}); out[m][f]=(out[m][f]||0)+v; };
  const pv=S.prov.itens||[];
  pv.forEach(x=>add(x.data.slice(0,7), x.classe==='Exterior'?'Proventos exterior':'Proventos Brasil', +x.valor||0));
  Object.entries(S.prov.mensal||{}).forEach(([m,o])=>{ add(m,'Proventos Brasil',+o.Brasil||0); add(m,'Proventos exterior',+o.Exterior||0); });
  Object.entries(S.prov.anos||{}).forEach(([y,v])=>{ if(!Object.keys(out).some(m=>m.startsWith(y))) add(y+'-12','Proventos Brasil',+v||0); });
  potesList().forEach(p=>{ const f = p.reserva?'Reserva de emergência' : p.tipo==='cartao'?'Caixinha do cartão' : p.tipo==='caixinha'?'Outras caixinhas':'Investimentos';
    (p.movimentos||[]).filter(m=>m.tipo==='rendimento').forEach(m=>add(m.data.slice(0,7),f,+m.valor||0)); });
  return out;
}
const FONTES=[['Reserva de emergência','var(--accent)'],['Caixinha do cartão','var(--c7)'],['Outras caixinhas','var(--c3)'],['Investimentos','var(--c4)'],['Proventos Brasil','var(--c1)'],['Proventos exterior','var(--c5)']];
function vRend(){
  const F=rendFontes(); const anos=[...new Set(Object.keys(F).map(m=>m.slice(0,4)))].sort();
  const ano = UI.rendAno && anos.includes(UI.rendAno) ? UI.rendAno : (anos[anos.length-1]||thisMonth().slice(0,4));
  const tot=(m,f)=>f?(F[m]||{})[f]||0:sum(Object.values(F[m]||{}));
  const ms=Array.from({length:12},(_,i)=>ano+'-'+String(i+1).padStart(2,'0')).filter(m=>m<=thisMonth());
  const tAno=sum(ms,m=>tot(m)), provAno=sum(ms,m=>tot(m,'Proventos Brasil')+tot(m,'Proventos exterior'));
  const comDado=ms.filter(m=>tot(m)>0);
  let h = head('Investir','Rendimentos totais','Tudo o que seu dinheiro rendeu sozinho: reserva, caixinhas, investimentos e proventos', `<div class="actions"><button class="btn" data-act="novo-mov" data-tipo="rendimento">${svg('plus')}Rendimento</button><button class="btn pri" data-act="novo-provento">${svg('plus')}Provento</button></div>`);

    <div class="card stat"><div class="lbl">Proventos em ${ano}</div><div class="val sm pos">${fmt(provAno)}</div><div class="ft">Brasil + exterior</div></div>
    <div class="card stat"><div class="lbl">Reserva e caixinhas em ${ano}</div><div class="val sm pos">${fmt(tAno-provAno)}</div></div>
    <div class="card stat"><div class="lbl">Desde ${anos[0]||'—'}</div><div class="val sm pos">${fmt(totalGeral)}</div><div class="ft">Tudo o que já rendeu</div></div></div>`;
  const fontes=FONTES.filter(([f])=>ms.some(m=>tot(m,f)));
  const ser=fontes.map(([f,c])=>({name:f,color:c,values:ms.map(m=>tot(m,f))}));
  h += `<div class="card section"><div class="card-h"><div><h2>Rendimento por mês em ${ano}</h2></div></div>${barChart({labels:ms.map(mShort),series:ser,stacked:true,h:230})}${legend(ser)}</div>`;
  // ano a ano (como a aba Rend. anual)
  const fAll=FONTES.filter(([f])=>Object.keys(F).some(m=>tot(m,f)));
  const yv=(y,f)=>sum(Object.keys(F).filter(m=>m.startsWith(y)),m=>tot(m,f));
  h += `<div class="card section"><div class="card-h"><div><h2>Ano a ano</h2><p>Como a aba "Rend. anual" da sua planilha</p></div></div><div class="tbl-wrap"><table><thead><tr><th>Ano</th>${fAll.map(([f,c])=>`<th class="r"><span class="who" style="font-size:.66rem;white-space:nowrap"><i style="background:${c}"></i>${({'Reserva de emergência':'Reserva','Caixinha do cartão':'Cx. cartão','Outras caixinhas':'Caixinhas','Investimentos':'Invest.','Proventos Brasil':'Prov. BR','Proventos exterior':'Prov. ext.'})[f]||f}</span></th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
    ${anos.map(y=>`<tr><td><b>${y}</b></td>${fAll.map(([f])=>`<td class="r">${yv(y,f)?fmt(yv(y,f)):'<span class="muted">—</span>'}</td>`).join('')}<td class="r"><b class="pos">${fmt(yv(y))}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td>${fAll.map(([f])=>`<td class="r">${fmt(sum(anos,y=>yv(y,f)))}</td>`).join('')}<td class="r">${fmt(totalGeral)}</td></tr></tfoot></table></div></div>`;
  // proventos itemizados do ano
  const pv=(S.prov.itens||[]).filter(x=>x.data.startsWith(ano));

const CART_CLASSES = ['Renda fixa','Ações','FIIs','Cripto','Exterior'];
const ALVO_PADRAO = {'Renda fixa':55,'Ações':10,'FIIs':15,'Cripto':10,'Exterior':10};
function carteiraGrupo(p){
  // Como na planilha: reserva + investimentos formam a carteira; caixinhas de objetivos e "Outros" ficam à parte
  if(p.tipo==='cartao') return null;
  if(p.tipo==='caixinha' && !p.reserva) return 'Outros';
  if(p.classe==='Tesouro Direto') return 'Renda fixa';
  return CART_CLASSES.includes(p.classe) ? p.classe : 'Outros';
}
function donut(parts,total,center,sub){
  const r=70,c=2*Math.PI*r; let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*c; const seg=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" data-tip="${esc(p.k)}: ${esc(fmt(p.v))} (${esc(pct(p.v/total))})"/>`; off+=len; return seg;}).join('');
  return `<svg viewBox="0 0 180 180" style="width:190px;height:190px;flex:none">${segs}<text x="90" y="88" text-anchor="middle" font-family="var(--display)" font-size="14.5" font-weight="700" fill="var(--ink)">${esc(center)}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sub)}</text></svg>`;
}

function carteiraAtual(){
  const alvo = Object.assign({},ALVO_PADRAO,S.config.alvo||{});
  const g={}; CART_CLASSES.forEach(k=>g[k]=0);
  potesList().forEach(p=>{ const k=carteiraGrupo(p); if(k in g) g[k]+=potSaldo(p); });
  return {alvo,g,tot:sum(CART_CLASSES,k=>g[k])};
}
function simular(V){
  const {alvo,g,tot}=carteiraAtual(); const T=tot+V;
  const need={}; CART_CLASSES.forEach(k=>need[k]=Math.max(0,T*(+alvo[k]||0)/100-g[k]));
  const tn=sum(Object.values(need)); const out={};
  CART_CLASSES.forEach(k=>out[k]= tn>0 ? V*need[k]/tn : V*(+alvo[k]||0)/100);
  // arredonda para centavos mantendo a soma
  let acc=0; const ks=CART_CLASSES.filter(k=>out[k]>0.004); ks.forEach((k,i)=>{ out[k]= i===ks.length-1 ? r2(V-acc) : r2(out[k]); acc+=out[k]; });
  return {alvo,g,tot,T,out};
}
function simHtml(){
  const V=+UI.sim||0;
  if(V<=0){
    const {alvo,g,tot}=carteiraAtual();
    const L=CART_CLASSES.map(k=>({k,d:(tot?g[k]/tot*100:0)-(+alvo[k]||0)})).filter(x=>x.d<-0.5).sort((a,b)=>a.d-b.d);
    return L.length?`<p class="muted" style="margin:0;font-size:.86rem">Hoje estão abaixo do alvo: ${L.map(x=>`<b style="color:var(--ink)">${x.k==='Renda fixa'?'Renda Fixa':x.k}</b> (${x.d.toLocaleString('pt-BR',{maximumFractionDigits:1})} pontos)`).join(', ')}.</p>`:'<p class="muted" style="margin:0">Sua carteira está dentro do alvo.</p>';
  }
  const r=simular(V);
  const rows=CART_CLASSES.filter(k=>r.out[k]>0).sort((a,b)=>r.out[b]-r.out[a]);
  return `<div class="rows">${rows.map(k=>{const antes=r.tot?r.g[k]/r.tot:0, depois=(r.g[k]+r.out[k])/r.T; return `<div class="row" style="padding:8px 0"><i class="dot" style="background:${CLASS_COLOR[k]}"></i><div class="grow"><div class="t">${k==='Renda fixa'?'Renda Fixa':k}</div><div class="s">${pct(antes)} → <b style="color:var(--ink)">${pct(depois)}</b> · alvo ${r.alvo[k]}%</div></div><span class="v" style="font-size:1.05rem">${fmt(r.out[k])}</span></div>`;}).join('')}</div>
    <div class="actions" style="margin-top:10px;justify-content:space-between;align-items:center"><span class="muted" style="font-size:.8rem">Carteira vai para ${fmt(r.T)}</span><button class="btn pri sm" data-act="sim-registrar">Já investi, registrar</button></div>
    <p class="note">Conta feita com a sua sugestão de alocação. Não é recomendação de investimento.</p>`;
}

function meliuzCx(){ return potesList().find(p=>p.id==='meliuz-nk') || potesList().find(p=>p.tipo==='caixinha' && semAcento(p.nome).startsWith('meliuz')); }

function assinaturaCalc(p){

}

function openPote(id){

/* ================= forms ================= */
function modal(html, wide){
  const root=document.getElementById('modal-root');
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet ${wide==='xl'?'wide xl':wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = root.querySelector('input,select,button:not([data-close])'); if(f) setTimeout(()=>f.focus(),20);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function form({title, fields, submit='Salvar', onSubmit, extra=''}){
  const fh = fields.map(f=>{
    if(f.type==='row') return `<div class="frow">${f.items.map(fieldHtml).join('')}</div>`;
    return fieldHtml(f);
  }).join('');
  modal(`<form id="frm"><h3>${esc(title)}</h3>${fh}${extra}<div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri" type="submit">${esc(submit)}</button></div></form>`);
  const frm = document.getElementById('frm');
  frm.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; e.preventDefault(); sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); sg.dataset.value=b.dataset.v; }));
  frm.addEventListener('submit', e=>{
    e.preventDefault();
    const v={}; frm.querySelectorAll('[name]').forEach(el=>v[el.name]= el.type==='checkbox'?el.checked:el.value);
    frm.querySelectorAll('.seg').forEach(sg=>v[sg.dataset.name]=sg.dataset.value);
    const err = onSubmit(v); if(err){ toast(err); return; }
    closeModal();
  });
}
function fieldHtml(f){
  const id='f-'+f.name;
  if(f.type==='select') return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" name="${f.name}">${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(val)===String(f.value)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select></div>`;
  if(f.type==='seg') return `<div class="field"><label>${esc(f.label)}</label><div class="seg" data-name="${f.name}" data-value="${esc(f.value)}">${f.options.map(([val,lab])=>`<button type="button" data-v="${val}" aria-pressed="${val===f.value}">${lab}</button>`).join('')}</div></div>`;
  if(f.type==='check') return `<label class="field" style="flex-direction:row;align-items:center;gap:8px;font-size:.86rem"><input type="checkbox" id="${id}" name="${f.name}" ${f.value?'checked':''} style="width:auto">${esc(f.label)}</label>`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label><input id="${id}" name="${f.name}" type="${f.type==='date'?'date':f.type==='month'?'month':'text'}" ${f.type==='money'?'inputmode="decimal" placeholder="0,00"':''} value="${esc(f.value??'')}" ${f.req?'required':''} autocomplete="off"></div>`;
}

/* compra no cartão (de qualquer tela) */
function guardarNaCaixinhaCartao(valor,data,obs){
  let cx=potesList().find(p=>p.tipo==='cartao'); let id=cx&&cx.id, q;
  if(!cx){ id='caixinha-cartao'; q={nome:'Caixinha do cartão',tipo:'cartao',classe:'Renda fixa',meta:0,reserva:false,cor:'#6b5bd3',ordem:50,instituicao:'',movimentos:[]}; }
  else q=JSON.parse(JSON.stringify(S.potes[id]));
  const mid=uid('m'); q.movimentos=q.movimentos||[]; q.movimentos.push({id:mid,data,tipo:'aporte',valor,obs}); save('potes',id,q); return {pote:id,mov:mid};
}
function tirarDaCaixinha(compra){
  // apagou uma compra marcada como guardada: tira o valor que entrou na caixinha do cartão
  const pid=compra.cxPote||(potesList().find(p=>p.tipo==='cartao')||{}).id; if(!pid||!S.potes[pid]) return;
  const q=JSON.parse(JSON.stringify(S.potes[pid])); const ms=q.movimentos||[];
  const i=compra.cxMov?ms.findIndex(m=>m.id===compra.cxMov):ms.findIndex(m=>m.tipo==='aporte'&&m.obs==='Guardado para '+compra.desc&&m.data===compra.data&&Math.abs(m.valor-compra.valor)<0.005);
  if(i<0) return; ms.splice(i,1); save('potes',pid,q);
}
function cicloConta(c){ return faturaMes(c.cartao, todayISO()); }
function comprasGuardadasAbertas(){
  const r=[], tm=thisMonth();
  [addMonth(tm,-2),addMonth(tm,-1),tm].forEach(mk=>(S.cartao[mk]?.compras||[]).forEach(x=>{ if(!x.guardado) return; const F=x.fatura||faturaMes(x.cartao,x.data); if(F===faturaMes(x.cartao,todayISO())) r.push({...x,F}); }));
  return r.sort((a,b)=>a.data.localeCompare(b.data));
}
function compraDaConta(c,F){
  // compra lançada no cartão com o mesmo nome da conta recorrente, na mesma fatura: é a própria conta daquele mês
  const n=semAcento(c.desc); let achou=null;
  [addMonth(F,-2),addMonth(F,-1),F].forEach(mk=>(S.cartao[mk]?.compras||[]).forEach(x=>{ if(!achou&&!x.parcela&&x.cartao===c.cartao&&semAcento(x.desc)===n&&(x.fatura||faturaMes(x.cartao,x.data))===F) achou=x; }));
  return achou;
}
function contaGuardadaNoCiclo(c){ const ci=cicloConta(c); const g=((S.cinfo.guardados||{})[ci]||{})[c.id]; if(g) return g; const x=compraDaConta(c,ci); return x&&x.guardado?{compra:x.id}:null; }
function marcarGuardado(lista){
  if(readonlyView()) return save();
  const g=JSON.parse(JSON.stringify(S.cinfo.guardados||{}));
  lista.forEach(c=>{ const ci=cicloConta(c); if(((g[ci]||{})[c.id])) return; const r=guardarNaCaixinhaCartao(+c.valor||0,todayISO(),'Guardado para '+c.desc+' (fatura de '+MESES[+ci.slice(5)-1].toLowerCase()+')'); (g[ci]=g[ci]||{})[c.id]=r; });
  S.cinfo={...S.cinfo,guardados:g}; save('cartaoinfo','geral',S.cinfo);
}
function lancarCompraCartao({desc,valor,data,cartao,parcela,tipo,cat,guardado}){
  const mk=data.slice(0,7); const c=S.cartao[mk]?JSON.parse(JSON.stringify(S.cartao[mk])):{mes:mk,compras:[]}; const cid=uid('c');
  const cp={id:cid,data,desc,valor,parcela:parcela||'',cartao}; if(cat) cp.cat=cat; if(guardado) cp.guardado=true; c.compras.push(cp); save('cartao',mk,c);
  if(cat){ S.config.regras={...(S.config.regras||{}),[chaveDesc(desc)]:cat}; save('config','geral',{...S.config}); }
  const fm=faturaMes(cartao,data), nomeF=MESES[+fm.slice(5)-1].toLowerCase(), nc=cartao==='MP'?'Mercado Pago':cartao;
  if(parcela){ addParcelaDeCompra({id:cid,data,desc,valor,parcela,cartao},tipo||'limite'); return 'Compra em '+parcela.toLowerCase()+' no '+nc+' · 1ª parcela na fatura de '+nomeF; }

}

async function saveFile(name, txt){

let pendingImport=null, pendingCasal=null;
function mergeDoc(old, neu){
  const clean=o=>{ const x={...o}; delete x.__drop; return x; };
  if(!old) return clean(neu);
  const out={...old}, drop=neu.__drop||{};
  for (const [k,v] of Object.entries(neu)){ if(k==='__drop') continue;
    if (Array.isArray(v) && Array.isArray(old[k]) && v.length && v.every(x=>x&&typeof x==='object'&&x.id!==undefined)){
      let base=old[k]; if(drop[k]){ const re=new RegExp(drop[k]); base=base.filter(x=>!(x&&re.test(String(x.id)))); }
      const ids=new Set(v.map(x=>x.id)); out[k]=[...base.filter(x=>!ids.has(x&&x.id)), ...v];
    } else out[k]=v; }
  if (drop) for (const [k,re] of Object.entries(drop)) if(!(k in neu) && Array.isArray(out[k])) out[k]=out[k].filter(x=>!(x&&new RegExp(re).test(String(x.id))));
  return out;
}
function importarFundoCasal(pc){
  if(!pc||!pc.fundo) return 0;
  if(!C.cid||!C.parc){ toast('Vincule o casal primeiro para trazer o controle do Alelo'); return 0; }
  const f = C.fundo ? JSON.parse(JSON.stringify(C.fundo)) : {carteiras:[{id:'alelo',nome:'Alelo '+meuNome(),dono:C.me,tipo:'alelo',padrao:0},{id:'dinheiro',nome:'VR '+nomeParceiro()+' (dinheiro)',dono:C.parc,tipo:'dinheiro',padrao:0}],lancamentos:[]};
  const al=f.carteiras.find(c=>c.tipo==='alelo')||f.carteiras[0];
  const novos=(pc.fundo.lancamentos||[]).map(l=>({...l,carteira:l.carteira==='@alelo'?al.id:l.carteira,quem:l.quem||al.dono}));
  const ids=new Set(novos.map(l=>l.id));
  const temIni=novos.some(l=>l.inicial&&l.carteira===al.id);
  f.lancamentos=[...(f.lancamentos||[]).filter(l=>!ids.has(l.id) && !(temIni && l.inicial && l.carteira===al.id)), ...novos];
  saveFundo(f); return novos.length;
}
async function runImport(modo){
  const nc=importarFundoCasal(pendingCasal); pendingCasal=null;
  if(nc && !Object.keys(pendingImport||{}).length){ pendingImport=null; closeModal(); toast(nc+' lançamentos do Alelo no Fundo do rolê'); return; }
  const d=pendingImport; pendingImport=null; if(readonlyView()){ toast('Volte para a sua tela para importar'); return; } if(!d||!db){ toast('Sem conexão com o armazenamento'); return; }
  closeModal(); toast('Importando…'); let n=0; const atual=BACKUP_COLS();
  try { for (const [col,docs] of Object.entries(d)) for (const [id,body] of Object.entries(docs||{})) { if(body && typeof body==='object'){ const old=(atual[col]||{})[id]; const fim = modo==='substituir' ? mergeDoc(null,body) : mergeDoc(old && Object.keys(old).length?old:null, body); await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(fim))); n++; } } toast(n+' registros atualizados'); }
  catch(e){ toast('A importação parou no meio. Tente de novo.'); }
}

  else h += `<div class="card section" data-go="casal-role" style="cursor:pointer;display:flex;align-items:center;gap:14px"><span class="emo" style="font-size:1.6rem">🍔</span><div style="flex:1"><h2>Fundo do rolê</h2><p class="muted" style="margin:2px 0 0;font-size:.84rem">Controlem o VR de vocês para lanche e almoço fora</p></div><span class="btn sm pri">Montar</span></div>`;
  h += `<p class="note">O dinheiro pessoal de cada um continua só na tela de cada um. Aqui entra apenas o que vocês colocam nas caixinhas do casal.</p>
    <div class="actions section" style="justify-content:flex-end"><button class="btn ghost danger sm" data-act="sair-casal">Desfazer vínculo do casal</button></div>`;

const ROLE_CATS=[['lanche','Lanche','🍔'],['restaurante','Restaurante','🍽️'],['mercado','Mercado','🛒'],['delivery','Delivery','🛵'],['passeio','Cinema / passeio','🎬'],['outros','Outros','✨']];
const ROLE_CAT=Object.fromEntries(ROLE_CATS.map(c=>[c[0],c]));
const COMIDA=['lanche','restaurante','mercado'];
function saveFundo(f){ C.fundo=f; render(); window.__couple.casalDb(C.cid).collection('fundo').doc('role').set(JSON.parse(JSON.stringify(f))).catch(()=>toast('Não consegui salvar. Tente de novo.')); }
function carteiraSaldo(f,cid,mk){ return sum((f.lancamentos||[]).filter(l=>l.carteira===cid&&(!mk||l.data.startsWith(mk))),l=>l.tipo==='entrada'?l.valor:-l.valor); }
function vRole(){
  let h = head('Casal','Fundo do rolê','O VR de vocês dois, só para lanche, almoço fora e bobeiras juntos', C.fundo?`<div class="actions"><button class="btn" data-act="role-entrada">${svg('plus')}Entrou VR</button><button class="btn pri" data-act="role-gasto">${svg('plus')}Gasto</button></div>`:'');

  if (!C.parc) return h+vincularHtml();
  const f=C.fundo;
  if (!f){
    return h+`<div class="card" style="max-width:640px"><h2>Vamos montar o fundo de vocês</h2><p class="sub">São duas carteiras. O dinheiro continua onde está: no cartão Alelo e com quem recebe em dinheiro. O app só controla quanto vocês têm para os rolês.</p>
      <div class="grid g2 section">
        <div style="border:1px solid var(--line);border-radius:14px;padding:14px"><div class="lbl" style="font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase"><span class="emo">💳</span> Cartão (Alelo)</div>
          <div class="field" style="margin-top:8px"><label for="rc-a-dono">Quem recebe</label><select id="rc-a-dono"><option value="${C.me}">${esc(meuNome())}</option><option value="${C.parc}">${esc(nomeParceiro())}</option></select></div>
          <div class="field" style="margin:0"><label for="rc-a-val">VR por mês (opcional)</label><input id="rc-a-val" inputmode="decimal" placeholder="0,00"></div></div>
        <div style="border:1px solid var(--line);border-radius:14px;padding:14px"><div class="lbl" style="font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase">💵 Dinheiro</div>
          <div class="field" style="margin-top:8px"><label for="rc-d-dono">Quem recebe</label><select id="rc-d-dono"><option value="${C.parc}">${esc(nomeParceiro())}</option><option value="${C.me}">${esc(meuNome())}</option></select></div>
          <div class="field" style="margin:0"><label for="rc-d-val">VR por mês (opcional)</label><input id="rc-d-val" inputmode="decimal" placeholder="0,00"></div></div>
      </div>
      <div class="field section"><label for="rc-saldo">Saldo que já tem hoje no Alelo (opcional)</label><input id="rc-saldo" inputmode="decimal" placeholder="0,00" style="max-width:220px"></div>
      <button class="btn pri" data-act="role-criar">Criar fundo do rolê</button></div>`;
  }

  const cs=f.carteiras||[]; const tot=sum(cs,c=>carteiraSaldo(f,c.id));
  const gMes=sum(L.filter(l=>l.tipo==='gasto'&&l.data.startsWith(mk)),l=>l.valor);

    ${cs.map(c=>{const sd=carteiraSaldo(f,c.id); return `<div class="card stat"><div class="lbl">${ic(c)} ${esc(c.nome)}</div><div class="val sm ${sd<0?'neg':''}">${fmt(sd)}</div><div class="ft"><span class="who"><i style="background:${corDe(c.dono)}"></i>${esc(nomeDe(c.dono))}</span>${+c.padrao?' · VR '+fmt(c.padrao)+'/mês':''}</div></div>`;}).join('')}
    <div class="card stat"><div class="lbl">Gasto em ${mShort(mk)}</div><div class="val sm">${fmt(gMes)}</div><div class="ft">${eMes?`Entrou ${fmt(eMes)} de VR`:'Nenhum VR lançado no mês'}</div></div>
  </div>`;

  const faltaVR=cs.filter(c=>+c.padrao && !L.some(l=>l.tipo==='entrada'&&!l.inicial&&l.carteira===c.id&&l.data.startsWith(mk)));
  if (faltaVR.length) h += `<div class="banner section" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>O VR de ${mLabel(mk).toLowerCase()} ainda não foi lançado${faltaVR.length===1?' em '+esc(faltaVR[0].nome):''}.</span><span class="actions">${faltaVR.map(c=>`<button class="btn sm pri" data-act="role-vr-rapido" data-cart="${c.id}">+ ${fmt(c.padrao)} em ${esc(c.nome)}</button>`).join('')}</span></div>`;
  const alelo=cs.find(c=>c.tipo==='alelo');

    <div class="card"><div class="card-h"><div><h2>Gastos por mês</h2><p>Por carteira</p></div></div>${ms.length?barChart({labels:ms.map(mShort),series:ser,stacked:true,h:180})+legend(ser):'<p class="muted">Sem dados ainda.</p>'}</div>

  const mm=[...new Set(L.map(l=>l.data.slice(0,7)))].sort();
  if (mm.length>1){ let acc=0; const rows=mm.map(m=>{ const e=sum(L.filter(l=>l.tipo==='entrada'&&!l.inicial&&l.data.startsWith(m)),l=>l.valor), ini=sum(L.filter(l=>l.tipo==='entrada'&&l.inicial&&l.data.startsWith(m)),l=>l.valor), g=sum(L.filter(l=>l.tipo==='gasto'&&l.data.startsWith(m)),l=>l.valor); const antes=acc+ini; acc=antes+e-g; return {m,antes,e,g,fim:acc}; }).reverse();

      else if(/aplicacao|resgate|\brdb\b|caixinha|cofrinho|guardad|investiment|poupanca|cdb|tesouro|corretora/.test(n)){ l.ok=false; l.motivo='Caixinha ou investimento'; }
      else if(eu && n.includes(eu)){ l.ok=false; l.motivo='Transferência para você mesma'; }
      l.cat=sugerirCat(l.desc);
      const mk=l.data.slice(0,7), av=(S.orc[mk]?.avulsos||[]);
      if(l.ok && av.some(a=>Math.abs(a.valor-l.valor)<0.011 && perto(a.data,l.data,2))){ l.ok=false; l.motivo='Já lançado no app'; l.dup=true; }
    } else {
      l.cat=sugerirCat(l.desc);
      const pm=l.descOrig.match(/parcela\s+(\d+)\s*\/\s*(\d+)/i);
      const compras=[addMonth(l.data.slice(0,7),-1),l.data.slice(0,7),addMonth(l.data.slice(0,7),1)].flatMap(mk=>(S.cartao[mk]?.compras||[]).map(c=>({...c,mk})));
      if(!l.saida){ l.tipoL='Estorno'; l.ok=!/pagamento/i.test(n); l.motivo=l.ok?'':'Pagamento da fatura'; return; }
      if(pm){ l.parc=[+pm[1],+pm[2]]; l.desc=l.desc.replace(/\s*-\s*parcela.*$/i,''); l.tipoL='Parcela '+pm[1]+'/'+pm[2];
        if(+pm[1]>1){ l.ok=false; l.motivo='Parcela de compra antiga (fica na aba Parcelas)'; return; }
        const tot=r2(l.valor*l.parc[1]); const tk=tokens(l.descOrig);
        const ja=(S.cinfo.parcelas||[]).some(p=>p.cartao===IMP.cartao&&(Math.abs(sum(p.valores)-tot)<0.1*l.parc[1]||tokens(p.desc).some(w=>tk.includes(w)))&&p.valores.length===l.parc[1]) || compras.some(c=>c.cartao===IMP.cartao&&c.parcela&&tokens(c.desc).some(w=>tk.includes(w)));
        if(ja){ l.ok=false; l.motivo='Já lançada no app'; l.dup=true; } return; }
      l.tipoL=/^iof/i.test(l.descOrig)?'IOF':'Compra';
      const conta=(S.cinfo.contas||[]).find(c=>c.cartao===IMP.cartao&&Math.abs((+c.valor||0)-l.valor)<0.011);
      if(conta){ l.ok=false; l.dup=true; l.motivo='Já está em Contas no cartão ('+conta.desc+')'; return; }
      const parc=(S.cinfo.parcelas||[]).find(p=>p.cartao===IMP.cartao&&parcMeses(p).some((m,i)=>m===IMP.fatura&&Math.abs(p.valores[i]-l.valor)<0.011));
      if(parc){ l.ok=false; l.dup=true; l.motivo='Já está em Parcelas ('+parc.desc+')'; return; }
      const tk=tokens(l.descOrig);
      const m=compras.find(c=>c.cartao===IMP.cartao&&!c.parcela&&perto(c.data,l.data,3)&&(Math.abs(c.valor-l.valor)<0.011||(tokens(c.desc).some(w=>tk.includes(w))&&Math.abs(c.valor-l.valor)/l.valor<0.08)));
      if(m){ l.ok=false; l.motivo='Já lançado no app'+(Math.abs(m.valor-l.valor)>0.01?' ('+fmt(m.valor)+')':''); l.dup=true; l.match=m; }
    }
  });
  // IOF já somado na compra (ex.: compra internacional lançada com o IOF junto)
  IMP.linhas.filter(l=>l.tipoL==='IOF').forEach(l=>{ const alvo=(l.descOrig.match(/"([^"]+)"/)||[])[1]; const irmao=IMP.linhas.find(x=>x!==l&&alvo&&x.descOrig.includes(alvo));
    if(irmao&&irmao.match&&Math.abs(irmao.match.valor-irmao.valor-l.valor)<0.02){ l.ok=false; l.dup=true; l.motivo='Já somado na compra '+irmao.match.desc; } });
}

      regras[chaveDesc(l.descOrig)]=l.cat; });

function salvarGasto(){
  lerG(); if(readonlyView()){ toast('Só '+nomeParceiro()+' pode alterar'); return; }
  const val=r2(parseNum(G.valor)); if(!val){ toast('Informe o valor'); document.getElementById('g-valor').focus(); return; }
  const cat=G.cat||'gerais', item=(G.item||itemPadrao(cat)).trim(), desc=G.desc.trim()||item, data=G.data||todayISO();
  UI.lastForma=G.forma;
  if(G.desc.trim()) S.config.regras={...(S.config.regras||{}),[chaveDesc(desc)]:cat+'|'+item};
  if(G.rec && G.forma.startsWith('card:')){
    const card=G.forma.slice(5), desde=faturaMes(card,data);
    const conta={id:uid('c'),desc,cartao:card,valor:val,guardado:G.guardado,cat:cat+'|'+(G.item?item:desc),desde};
    save('cartaoinfo','geral',{...S.cinfo,contas:[...(S.cinfo.contas||[]),conta]});
    const cx=potesList().find(p=>p.tipo==='cartao');
    if(G.guardado && G.guardarAgora && cx){ const r=guardarNaCaixinhaCartao(val,data,'Guardado para '+desc); const g=JSON.parse(JSON.stringify(S.cinfo.guardados||{})), ci=cicloConta(conta); (g[ci]=g[ci]||{})[conta.id]=r; S.cinfo={...S.cinfo,guardados:g}; save('cartaoinfo','geral',S.cinfo); }
    if(G.desc.trim()) save('config','geral',{...S.config});
    UI.contasTab=G.guardado?'guardado':'sem';
    closeModal(); toast(desc+' agora cai todo mês no '+(card==='MP'?'Mercado Pago':card)+(G.guardado&&G.guardarAgora&&cx?' · '+fmt(val)+' guardado na caixinha':'')); return; }
  if(G.forma.startsWith('card:')){
    UI.lastGuardaCompra=G.guardaCompra;
    let msg=lancarCompraCartao({desc,valor:val,data,cartao:G.forma.slice(5),parcela:G.parcela,tipo:G.guardaCompra?'guardado':'limite',cat:cat+'|'+item,guardado:G.guardaCompra});
    if(G.guardaCompra){ const r=guardarNaCaixinhaCartao(val,data,'Guardado para '+desc); const mk=data.slice(0,7), q=JSON.parse(JSON.stringify(S.cartao[mk])), x=q.compras[q.compras.length-1]; if(x){ x.cxPote=r.pote; x.cxMov=r.mov; save('cartao',mk,q); } msg+=' · '+fmt(val)+' entrou na caixinha do cartão'; }
    closeModal(); toast(msg); return; }
  const mk=data.slice(0,7); const o=orcPara(mk); o.itens=o.itens||[]; o.avulsos=o.avulsos||[];
  let it=itemPorNome(o,cat,item); if(!it){ it={id:uid('i'),cat,nome:item,previsto:0,real:0}; o.itens.push(it); }
  it.real=r2((+it.real||0)+val);
  if(G.rec){ it.previsto=val; it.fixo=true; }
  o.avulsos.push({id:uid('a'),data,desc,valor:val,forma:G.forma,cat,itemId:it.id});
  save('orcamento',mk,o); if(G.desc.trim()) save('config','geral',{...S.config});
  closeModal(); toast(fmt(val)+' em '+CAT_CURTO[cat]+' › '+it.nome+(G.rec?' · previsto todo mês':'')+(mk!==UI.month?' ('+mLabel(mk)+')':''));
}

  const t=e.target;
  if(t.dataset.item){ const o=ensureOrc(UI.month); const it=o.itens.find(i=>i.id===t.dataset.item); if(!it) return; const f=t.dataset.f; let nv = f==='nome'? t.value.trim() : r2(parseNum(t.value)); if(f==='real'){ const cg=cartaoDoItem(o,it); nv=r2(Math.max(0,nv-cg)); } if(it[f]===nv){ if(f==='real') render(); return; } it[f]=nv; save('orcamento',UI.month,o); return; }
  if(t.dataset.saldoPote){ const id=t.dataset.saldoPote, p=S.potes[id]; if(!p) return; const n=r2(parseNum(t.value)), diff=r2(n-potSaldo(p)); if(Math.abs(diff)<0.005) return;
    const q=JSON.parse(JSON.stringify(p)); q.movimentos=q.movimentos||[]; const aj = (p.classe==='Outros'||(p.tipo==='caixinha'&&!p.reserva&&false));
    q.movimentos.push({id:uid('m'),data:todayISO(),tipo:aj?'ajuste':'rendimento',valor:diff,obs:'Atualização de saldo'}); save('potes',id,q); toast(p.nome+': '+fmt(n)); return; }
  if(t.dataset.renda!==undefined && t.dataset.renda!==''){ const o=ensureOrc(UI.month); const r=o.rendas[+t.dataset.renda]; if(!r) return; const f=t.dataset.f; r[f]= f==='nome'?t.value.trim():r2(parseNum(t.value)); o.renda=r2(sum(o.rendas,x=>x.real)); o.rendaPrevista=r2(sum(o.rendas,x=>x.previsto)); save('orcamento',UI.month,o); return; }
  if(t.dataset.fatura){ const f=JSON.parse(JSON.stringify(S.cinfo.faturas||{})); const m=t.dataset.mes; f[m]=f[m]||{}; if(t.value.trim()==='') delete f[m][t.dataset.fatura]; else f[m][t.dataset.fatura]=r2(parseNum(t.value)); save('cartaoinfo','geral',{...S.cinfo,faturas:f}); return; }
  if(t.dataset.orcField){ const o=ensureOrc(UI.month); o[t.dataset.orcField]=r2(parseNum(t.value)); save('orcamento',UI.month,o); return; }
  if(t.dataset.cfg){ save('config','geral',{...S.config,[t.dataset.cfg]:r2(parseNum(t.value))}); }
});
document.addEventListener('change', async e=>{
  if(e.target.id!=='imp-file' || !e.target.files[0]) return;
  try{ const j=JSON.parse(await e.target.files[0].text()); const d=j.dados||j; if(!d.potes&&!d.orcamento&&!(j.casal&&j.casal.fundo)) throw 0; pendingImport=d; pendingCasal=j.casal||null;
    const box=document.getElementById('imp-confirm'); box.innerHTML=`<div class="confirm"><span style="flex:1">Backup de ${esc((j.exportadoEm||'').slice(0,10).split('-').reverse().join('/')||'data desconhecida')}. ${j.descricao?esc(j.descricao)+'. ':''}"Juntar" mantém tudo o que você já lançou e só acrescenta ou atualiza o que vem no arquivo.</span><span class="actions"><button class="btn sm pri" data-act="importar-ok">Juntar (recomendado)</button><button class="btn sm ghost" data-act="importar-subst">Substituir</button></span></div>`; }
  catch(err){ toast('Esse arquivo não é um backup do app'); }
});
document.addEventListener('input', e=>{ if(e.target.id==='sim-valor'){ UI.sim=parseNum(e.target.value); const r=document.getElementById('sim-res'); if(r) r.innerHTML=simHtml(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.classList.contains('cell-input')) e.target.blur();
});
// tooltips
const tip=document.getElementById('tip');
document.addEventListener('pointermove', e=>{ const el=e.target.closest && e.target.closest('[data-tip]'); if(el){ tip.textContent=el.dataset.tip; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1; } else tip.style.opacity=0; });

let toastT; function toast(msg){ let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2400); }

/* ================= render ================= */
function render(){
  const main=document.getElementById('main');
  if(S.ready<8 && !(UI.perfil==='casal')){ main.innerHTML=mBrand()+switchMobile()+'<div class="loading">Carregando…</div>'; return; }
  pickMonth();
  // keep focus on inline inputs across re-render
  const ae=document.activeElement; const key = ae && ae.id ? '#'+ae.id : (ae && ae.dataset && ae.dataset.item ? `[data-item="${ae.dataset.item}"][data-f="${ae.dataset.f}"]` : null);
  const V={inicio:vInicio,gastos:vGastos,cartao:vCartao,caixinhas:vCaixinhas,reserva:vReserva,investimentos:vInvest,rendimentos:vRend,carteira:vCarteira,meliuz:vMeliuz,casal:vCasal,'casal-cx':vCasalCx,'casal-role':vRole};
  if(UI.perfil==='casal' && !UI.view.startsWith('casal')) UI.view='casal';
  if(UI.perfil!=='casal' && UI.view.startsWith('casal')) UI.view='inicio';
  const _cn = UI.perfil!=='casal' ? nomeView(UI.view) : null;
  main.innerHTML = mBrand() + switchMobile() + (readonlyView()?`<div class="banner" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>👀 Você está vendo as finanças de <b>${esc(nomeParceiro())}</b>. Só ${esc(nomeParceiro())} pode alterar.</span><button class="btn sm" data-perfil="eu">Voltar para as minhas</button></div>`:'') + (V[UI.view]||vInicio)();
  if(_cn){ const h1=main.querySelector('.top h1'); if(h1) h1.textContent=_cn; }
  let fab=document.getElementById('fab'); if(!fab){ fab=document.createElement('button'); fab.id='fab'; fab.className='fab'; fab.setAttribute('data-act','fab'); fab.setAttribute('aria-label','Lançar gasto'); fab.title='Lançar gasto'; fab.innerHTML=svg('plus'); document.body.appendChild(fab); }
  fab.hidden = readonlyView() || UI.perfil==='casal' || UI.view==='inicio';
  if(key && main.contains(ae)===false){ const n=main.querySelector(key); if(n && document.getElementById('modal-root').children.length===0) n.focus(); }
}
boot();
</script>

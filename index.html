<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b3f8c">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg,#f5f3f7);font-family:"Figtree",system-ui,sans-serif}
#login .box{max-width:360px;width:100%;text-align:center}
#login h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.8rem;margin:18px 0 6px;color:var(--ink,#231a2b)}
#login p{color:var(--ink-2,#554b5e);margin:0 0 24px}
#login button{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(0,0,0,.15);background:#fff;color:#222;border-radius:12px;padding:12px 20px;font:600 1rem "Figtree",system-ui,sans-serif;cursor:pointer}
#login .err{color:#c2412f;font-size:.86rem;margin-top:14px}
</style>
<!-- Firebase (grátis no plano Spark) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== Conexão com o Firebase: login com Google + dados em users/{seu id}/... ===== */
(function(){
  const cfgOk = window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/COLE_AQUI/.test(window.FIREBASE_CONFIG.apiKey);
  function loginScreen(msg){
    let el=document.getElementById('login');
    if(!el){ el=document.createElement('div'); el.id='login'; document.body.appendChild(el); }
    el.innerHTML='<div class="box"><svg width="64" height="64" viewBox="0 0 40 40"><defs><linearGradient id="lgx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b3f8c"/><stop offset="1" stop-color="#d8577e"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lgx)"/><g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 30V10h7a5.2 5.2 0 0 1 0 10.4h-7"/><path d="M19 20.4l6.5 9.6"/></g><path d="M30 6.5l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" fill="#fff"/></svg>'
      +'<h1>Finanças</h1><p>'+(cfgOk?'Entre com a sua conta Google para ver suas finanças.':'Falta configurar o Firebase: preencha o arquivo firebase-config.js (veja o LEIA-ME).')+'</p>'
      +(cfgOk?'<button id="btn-google"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</button>':'')
      +(msg?'<div class="err">'+msg+'</div>':'')+'</div>';
    const b=document.getElementById('btn-google');
    if(b) b.onclick=()=>{ const p=new firebase.auth.GoogleAuthProvider(); firebase.auth().signInWithPopup(p).catch(e=>{ if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') firebase.auth().signInWithRedirect(p); else loginScreen('Não consegui entrar: '+(e.message||e.code)); }); };
  }
  function adapterRoot(root){
    const snap=s=>({id:s.id,exists:s.exists,data:()=>s.data()});
    return {
      collection:name=>{ const c=root.collection(name); return {
        onSnapshot:(next,err)=>c.onSnapshot(q=>next({docs:q.docs.map(snap)}),err),
        doc:id=>({ set:d=>c.doc(id).set(d), delete:()=>c.doc(id).delete() }) }; },
      doc:path=>{ const [c,id]=path.split('/'); const r=root.collection(c).doc(id); return {
        onSnapshot:(next,err)=>r.onSnapshot(s=>next(snap(s)),err), set:d=>r.set(d), delete:()=>r.delete() }; }
    };
  }
  const fs=()=>firebase.firestore();
  const userDoc=uid=>fs().collection('users').doc(uid);
  let ME=null;
  window.__getDb = () => new Promise(resolve=>{
    if(!cfgOk){ loginScreen(); return; }
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fs().enablePersistence({synchronizeTabs:true}).catch(()=>{});
    let started=false;
    firebase.auth().onAuthStateChanged(async u=>{
      if(!u){ if(started) location.reload(); else loginScreen(); return; }
      const el=document.getElementById('login'); if(el) el.remove();
      if(started) return; started=true;
      ME={uid:u.uid, nome:(u.displayName||'').split(' ')[0]||'Eu'};
      try{ const p=await userDoc(u.uid).collection('perfil').doc('info').get(); if(!p.exists||!p.data().nome) await userDoc(u.uid).collection('perfil').doc('info').set({nome:ME.nome},{merge:true}); else ME.nome=p.data().nome; }catch(e){}
      resolve(adapterRoot(userDoc(u.uid)));
    });
  });
  /* ---- casal: convite, vínculo e dados compartilhados ---- */
  const ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const novoCodigo=()=>Array.from(crypto.getRandomValues(new Uint32Array(10)),n=>ALF[n%ALF.length]).join('');
  window.__couple = {
    get me(){ return ME; },
    dbFor: uid => adapterRoot(userDoc(uid)),
    casalDb: cid => adapterRoot(fs().collection('casais').doc(cid)),
    onCasal(cb){
      let unCasal=null, cur=null;
      userDoc(ME.uid).collection('perfil').doc('info').onSnapshot(s=>{
        const cid=s.exists?s.data().casalId:null; if(s.exists&&s.data().nome) ME.nome=s.data().nome;
        if(cid===cur) return; cur=cid; if(unCasal){ unCasal(); unCasal=null; }
        if(!cid){ cb(null); return; }
        unCasal=fs().collection('casais').doc(cid).onSnapshot(d=>{
          const x=d.exists?d.data():null;
          if(!x||!(x.membros||[]).includes(ME.uid)){ cb(null); return; }
          cb({cid, membros:x.membros||[], nomes:x.nomes||{}});
        }, ()=>cb(null));
      }, ()=>cb(null));
    },
    async criar(nome){
      const cid=novoCodigo();
      await fs().collection('casais').doc(cid).set({membros:[ME.uid], nomes:{[ME.uid]:nome||ME.nome}, criadoEm:new Date().toISOString()});
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:cid, nome:nome||ME.nome},{merge:true});
      return cid;
    },
    async entrar(cid,nome){
      await fs().collection('casais').doc(cid).update({membros:firebase.firestore.FieldValue.arrayUnion(ME.uid), ['nomes.'+ME.uid]:nome||ME.nome});
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:cid, nome:nome||ME.nome},{merge:true});
    },
    async sair(cid){
      try{ await fs().collection('casais').doc(cid).update({membros:firebase.firestore.FieldValue.arrayRemove(ME.uid), ['nomes.'+ME.uid]:firebase.firestore.FieldValue.delete()}); }catch(e){}
      await userDoc(ME.uid).collection('perfil').doc('info').set({casalId:firebase.firestore.FieldValue.delete()},{merge:true});
    }
  };
  window.__logout = () => firebase.auth().signOut();
  window.__saveFile = async (name, txt) => {
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); return {status:'saved'};
  };
})();
</script>
<title>Finanças</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ec; --surface:#ffffff; --surface-2:#eeede4; --ink:#14261e; --ink-2:#4b5a52; --muted:#86918a;
  --line:rgba(30,26,36,.10); --line-2:rgba(30,26,36,.18);
  --accent:#1f7a4f; --accent-ink:#ffffff; --accent-soft:#e2f1e8; --gold:#c98a14; --gold-soft:#faefd6;
  --good:#1f7a4f; --bad:#c2412f; --bad-soft:#fbe6e1;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#2f8f2f; --c7:#4a3aa7; --c8:#e34948;
  --shadow:0 1px 2px rgba(30,26,36,.05), 0 6px 20px rgba(30,26,36,.05);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1612; --surface:#15211b; --surface-2:#1c2b23; --ink:#eef2ec; --ink-2:#b6c2ba; --muted:#7f8c84;
    --line:rgba(238,242,236,.09); --line-2:rgba(238,242,236,.18);
    --accent:#4bbf8d; --accent-ink:#0b1a12; --accent-soft:rgba(75,191,141,.14); --gold:#e6b455; --gold-soft:rgba(230,180,85,.14);
    --good:#5fcf9b; --bad:#ef7a66; --bad-soft:rgba(239,122,102,.14);
    --c1:#4b95ec; --c2:#f07c4c; --c3:#2fc28c; --c4:#e3a91f; --c5:#e58bb0; --c6:#52b152; --c7:#9085e9; --c8:#ef6f6e;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1612; --surface:#15211b; --surface-2:#1c2b23; --ink:#eef2ec; --ink-2:#b6c2ba; --muted:#7f8c84;
  --line:rgba(238,242,236,.09); --line-2:rgba(238,242,236,.18);
  --accent:#4bbf8d; --accent-ink:#0b1a12; --accent-soft:rgba(75,191,141,.14); --gold:#e6b455; --gold-soft:rgba(230,180,85,.14);
  --good:#5fcf9b; --bad:#ef7a66; --bad-soft:rgba(239,122,102,.14);
  --c1:#4b95ec; --c2:#f07c4c; --c3:#2fc28c; --c4:#e3a91f; --c5:#e58bb0; --c6:#52b152; --c7:#9085e9; --c8:#ef6f6e;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:36px;height:36px;flex:none}
.brand .spark{transform-origin:30px 10.5px;animation:spark 3.2s ease-in-out infinite}
@keyframes spark{0%,70%,100%{transform:scale(1);opacity:1}80%{transform:scale(1.5) rotate(45deg);opacity:.7}}
.brand b{font-family:var(--display);font-size:1.12rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:500}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:0 0 4px;padding:0 10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;color:var(--ink-2);font-weight:500;font-size:.92rem}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.off i{background:var(--bad)}

main{padding:28px 32px 60px;max-width:1120px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:0 0 4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.15rem);letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.08rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:6px 0 0;font-size:.92rem}

.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthpick button{border:0;background:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.monthpick button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.monthpick button:disabled{opacity:.3;cursor:default}
.monthpick span{min-width:128px;text-align:center;font-weight:600;font-size:.92rem}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:14px}
.section{margin-top:14px}

.stat .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stat .val{font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .val.sm{font-size:1.3rem}
.stat .ft{font-size:.8rem;color:var(--ink-2);margin-top:4px}
.stat.hero{background:var(--ink);color:var(--bg);border-color:transparent}
.stat.hero .lbl,.stat.hero .ft{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.stat.hero .pos{color:#8fe0b8} .stat.hero .neg{color:#ffab9b}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--bad)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
.muted{color:var(--muted)}
.cell-input{width:100%;min-width:84px;max-width:120px;text-align:right;border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 6px;font-variant-numeric:tabular-nums}
.cell-input:hover{border-color:var(--line-2)}
.cell-input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.cell-name{max-width:none;text-align:left;min-width:120px}

/* category blocks */
.cat{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cat-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2)}
.cat-h b{font-weight:700;font-size:.9rem;flex:1}
.cat-h .num{font-weight:600;font-size:.88rem}
.cat table td,.cat table th{padding-left:14px;padding-right:10px}
.cat .add{padding:6px 10px;border-top:1px solid var(--line)}
.cat table td:first-child,.stat table td:first-child{width:100%}
.cat .cell-input{min-width:84px;max-width:104px;padding:4px 4px}
.stat table .cell-input{min-width:70px;max-width:92px;padding:4px 2px;font-size:.82rem}
.cat .cell-name,.stat table .cell-name{max-width:none;min-width:80px;width:100%}
.cat table th,.cat table td{padding-left:8px;padding-right:4px}
.cat table td:first-child,.cat table th:first-child{padding-left:14px}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.78rem;color:var(--muted)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.datebox{width:40px;flex:none;text-align:center;line-height:1.05;border-radius:9px;background:var(--surface-2);padding:5px 0}
.datebox b{display:block;font-size:.95rem;font-family:var(--display)}
.datebox small{font-size:.62rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}

/* pots */
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pot{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.pot:hover{transform:translateY(-2px);border-color:var(--line-2)}
.pot .top-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pot .name{font-weight:700;display:flex;align-items:center;gap:8px}
.pot .val{font-family:var(--display);font-size:1.45rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pot .meta{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pot.new{align-items:center;justify-content:center;border-style:dashed;color:var(--ink-2);font-weight:600;box-shadow:none;min-height:140px;background:transparent}

/* reserva ring */

.alloc{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface-2)}

.qa i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.scrim{position:fixed;inset:0;background:rgba(8,14,11,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}

.sheet.wide{max-width:620px}
.sheet h3{font-family:var(--display);margin:0 0 14px;font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bad-soft);padding:8px 10px;border-radius:10px;font-size:.84rem;margin-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2)}

.bnav{display:none}

const dBox = iso => `<div class="datebox"><b>${+iso.slice(8,10)}</b><small>${MES3[+iso.slice(5,7)-1]}</small></div>`;

try { const v = localStorage.getItem('fin.view'); if (v && VIEWS.some(x=>x.id===v)) UI.view = v; } catch(e) {}

const queues = {};
function save(col, id, data){
  if (readonlyView()) { toast('Você está vendo a tela de '+nomeParceiro()+'. Só '+nomeParceiro()+' pode alterar.'); render(); return; }
  // optimistic local update
  if (col==='orcamento') S.orc[id]=data;
  else if (col==='cartao') S.cartao[id]=data;
  else if (col==='potes') S.potes[id]=data;
  else if (col==='config') S.config=data;
  else if (col==='meliuz') S.meliuz=data;
  else if (col==='cartaoinfo') S.cinfo=data;
  else if (col==='proventos') S.prov=data;
  render();
  if (!db) { toast('Sem conexão com o armazenamento: esta alteração não foi salva'); return; }
  const key = col+'/'+id;
  queues[key] = (queues[key]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))).catch(e=>{
    if (e && e.code==='invalid_argument') { readonly=true; toast('Você só pode visualizar este app'); }
    else toast('Não consegui salvar. Tente de novo em instantes.');
  });
}
function remove(col,id){
  if (readonlyView()) { toast('Só '+nomeParceiro()+' pode alterar.'); return; }
  if (col==='potes') delete S.potes[id];
  render();
  if (db) db.collection(col).doc(id).delete().catch(()=>toast('Não consegui apagar. Tente de novo.'));
}

let unsubs=[], VIEW_DB=null;
function subscribeAll(src){
  unsubs.forEach(u=>{ try{ u&&u(); }catch(e){} }); unsubs=[];
  VIEW_DB=src;
  Object.assign(S,{orc:{},cartao:{},potes:{},config:{reservaMeses:6,cartoes:['Nubank','MP','C6']},meliuz:{itens:[]},cinfo:{parcelas:[],contas:[]},prov:{itens:[],anos:{}},hist:{meses:{},anos:{}},ready:0});
  UI.month=null; render();
  const sync = document.getElementById('sync');
  const done = new Set();
  const mark = k => { if(!done.has(k)){ done.add(k); S.ready=done.size; if(S.ready>=8){ pickMonth(); } } render(); };
  const onErr = () => { sync.classList.add('off'); sync.lastElementChild.textContent='Conexão perdida'; };
  const col=(n,f,k)=>unsubs.push(src.collection(n).onSnapshot(sn=>{ const o={}; sn.docs.forEach(d=>o[d.id]=d.data()); f(o); mark(k); }, onErr));
  const doc=(p,f,k)=>unsubs.push(src.doc(p).onSnapshot(d=>{ if(d.exists) f(d.data()); mark(k); }, onErr));
  col('orcamento',o=>S.orc=o,'o'); col('cartao',o=>S.cartao=o,'c'); col('potes',o=>S.potes=o,'p');
  doc('config/geral',d=>{ S.config=Object.assign({reservaMeses:6,cartoes:['Nubank','MP','C6']},d); if(S.config.paleta && !readonlyView()) applyPal(S.config.paleta); },'g');
  doc('meliuz/registro',d=>S.meliuz=Object.assign({itens:[]},d),'m');
  doc('proventos/lista',d=>S.prov=Object.assign({itens:[],anos:{}},d),'v');
  doc('historico/geral',d=>S.hist=Object.assign({meses:{},anos:{}},d),'h');
  doc('cartaoinfo/geral',d=>S.cinfo=Object.assign({parcelas:[],contas:[]},d),'k');
}
async function boot(){
  renderNav();
  let use = null;
  try { use = window.__getDb ? await window.__getDb() : (window.claude && window.claude.use ? await window.claude.use('db') : null); } catch(e){ use=null; }
  db = use;
  const sync = document.getElementById('sync');
  if (!db){
    sync.classList.add('off'); sync.lastElementChild.textContent='Sem armazenamento';
    S.ready = 8; S.offline = true; pickMonth(); render(); return;
  }
  online = true; sync.lastElementChild.textContent='Salvo na nuvem';
  subscribeAll(db);
  if (window.__couple) initCasal();
}

/* ================= derived ================= */
function monthsAll(){
  const set = new Set([...Object.keys(S.orc), ...Object.keys(S.cartao)]);
  set.add(thisMonth());
  return [...set].sort();
}
function pickMonth(){
  if (UI.month) return;
  const tm = thisMonth();
  const withData = Object.keys(S.orc).sort();
  UI.month = S.orc[tm] ? tm : (withData[withData.length-1] || tm);
}
function orcOf(mk){ return S.orc[mk] || null; }
function orcTotals(o){
  if(!o) return {renda:0,rendaPrev:0,desp:0,despPrev:0,saldo:0,saldoPrev:0,byCat:{}};
  const byCat={}; CATS.forEach(c=>byCat[c.k]={prev:0,real:0});
  (o.itens||[]).forEach(it=>{ const b=byCat[it.cat]||(byCat[it.cat]={prev:0,real:0}); b.prev+=+it.previsto||0; b.real+=+it.real||0; });
  const desp=sum(Object.values(byCat),b=>b.real), despPrev=sum(Object.values(byCat),b=>b.prev);
  return {renda:+o.renda||0, rendaPrev:+o.rendaPrevista||0, desp, despPrev, saldo:(+o.renda||0)-desp, saldoPrev:(+o.rendaPrevista||0)-despPrev, byCat};
}
function faturaOf(mk, cartao){ const c=S.cartao[mk]; if(!c) return 0; return sum((c.compras||[]).filter(x=>!cartao||cartao==='Todos'||x.cartao===cartao), x=>x.valor); }
function potSaldo(p){ return sum(p.movimentos||[], m=> m.tipo==='resgate' ? -m.valor : m.valor); }
function potAportado(p){ return sum((p.movimentos||[]).filter(m=>m.tipo==='aporte'),m=>m.valor) - sum((p.movimentos||[]).filter(m=>m.tipo==='resgate'),m=>m.valor); }
function potRend(p){ return sum((p.movimentos||[]).filter(m=>m.tipo==='rendimento'),m=>m.valor); }
function potesList(tipo){ return Object.entries(S.potes).map(([id,p])=>({id,...p})).filter(p=>!tipo||p.tipo===tipo).sort((a,b)=>(a.ordem??99)-(b.ordem??99)||a.nome.localeCompare(b.nome)); }
function custoMedio(){ return +S.config.custoMensal>0 ? +S.config.custoMensal : mediaGastos(); }
function mediaGastos(){
  // despesa real média dos últimos 3 meses com dados, sem o que foi para poupança
  const ks = Object.keys(S.orc).sort().filter(k=>k<=thisMonth()).slice(-3);
  if(!ks.length) return 0;
  return sum(ks, k=>{ const t=orcTotals(S.orc[k]); return t.desp - (t.byCat.poupanca?.real||0); })/ks.length;
}
function reservaPot(){ return potesList().find(p=>p.reserva); }

/* ================= charts ================= */
function barChart({labels, series, h=200, fmtY=fmtK, stacked=false}){
  const W=640, H=h, pl=52, pr=8, pt=12, pb=26;
  const n=labels.length; if(!n) return '<p class="muted">Sem dados ainda.</p>';
  const totals = labels.map((_,i)=> stacked ? sum(series,s=>Math.max(0,s.values[i])) : Math.max(...series.map(s=>s.values[i]||0)));
  let max = Math.max(1,...totals); const step = niceStep(max/4); max = Math.ceil(max/step)*step;
  const y = v => pt + (H-pt-pb)*(1 - v/max);
  const bw = (W-pl-pr)/n; const inner = Math.min(bw*0.72, stacked?34:44);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=0; v<=max+0.001; v+=step){ out+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${esc(fmtY(v))}</text>`; }
  labels.forEach((lb,i)=>{
    const cx = pl + bw*i + bw/2;
    if(stacked){
      let acc=0;
      series.forEach(s=>{ const v=Math.max(0,s.values[i]||0); if(!v) return; const y1=y(acc+v), y0=y(acc); out+=`<rect x="${cx-inner/2}" y="${y1}" width="${inner}" height="${Math.max(0,y0-y1-1)}" rx="2" fill="${s.color}" data-tip="${esc(lb)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`; acc+=v; });
    } else {
      const k=series.length, w=inner/k;
      series.forEach((s,j)=>{ const v=s.values[i]||0; const x=cx-inner/2+j*w; out+=`<rect x="${x+1}" y="${y(Math.max(0,v))}" width="${Math.max(2,w-2)}" height="${Math.max(0,y(0)-y(Math.max(0,v)))}" rx="3" fill="${s.color}" data-tip="${esc(lb)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`; });
    }
    out+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return out+'</svg>';
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1)))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function legend(series){ return '<div class="legend">'+series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')+'</div>'; }
function ring(p, big, small){
  const r=62, c=2*Math.PI*r, v=Math.max(0,Math.min(1,p));
  return `<svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="76" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${esc(big)}</text><text x="75" y="98" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(small)}</text></svg>`;
}

function monthPicker(){

}
function head(eyebrow, title, sub, right=''){
  return `<div class="top"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${right}</div>`;
}

    <div class="card stat"><div class="lbl">Nas caixinhas</div><div class="val">${fmt(guardado)}</div><div class="ft">${cx.length} caixinhas</div></div>

  const RA = resumoAno();

function resumoAno(){
  const ano=thisMonth().slice(0,4);
  const ms=Array.from({length:12},(_,i)=>ano+'-'+String(i+1).padStart(2,'0')).filter(m=>m<=thisMonth());
  const val=m=>{ const o=S.orc[m]; if(o){ const t=orcTotals(o), inv=t.byCat.poupanca?.real||0; return {entrou:t.renda,saiu:t.desp-inv,investi:inv}; } const h=(S.hist.meses||{})[m]; return h?{entrou:+h.entrou||0,saiu:+h.saiu||0,investi:+h.investi||0}:null; };
  const vs=ms.map(val);
  if(!vs.some(Boolean) && !Object.keys(S.hist.anos||{}).length) return {};
  const ser=[{name:'Entrou',color:'var(--accent)',values:vs.map(v=>v?v.entrou:0)},{name:'Saiu',color:'var(--c2)',values:vs.map(v=>v?v.saiu:0)},{name:'Investiu',color:'var(--gold)',values:vs.map(v=>v?v.investi:0)}];
  const tAno={entrou:sum(vs,v=>v?v.entrou:0),saiu:sum(vs,v=>v?v.saiu:0),investi:sum(vs,v=>v?v.investi:0)};
  const anos={...(S.hist.anos||{})}; anos[ano]=tAno; const ys=Object.keys(anos).sort();
  const chart=`<div class="card"><div class="card-h"><div><h2>Resumo de ${ano}</h2><p>Quanto entrou, saiu e foi investido em cada mês</p></div><button class="btn sm ghost" data-go="gastos">Ver gastos →</button></div>${barChart({labels:ms.map(mShort),series:ser,h:210})}${legend(ser)}</div>`;
  const table=`<div class="card"><div class="card-h"><div><h2>Ano a ano</h2><p>Como na aba GERAL da planilha</p></div></div><div class="tbl-wrap"><table><thead><tr><th>Ano</th><th class="r">Entrou</th><th class="r">Saiu</th><th class="r">Investiu</th><th class="r">% investido</th></tr></thead><tbody>${ys.map(y=>`<tr><td><b>${y}</b>${y===ano?' <span class="muted" style="font-size:.72rem">até agora</span>':''}</td><td class="r">${fmt(anos[y].entrou)}</td><td class="r">${fmt(anos[y].saiu)}</td><td class="r pos">${fmt(anos[y].investi)}</td><td class="r"><span class="pill">${pct(anos[y].entrou?anos[y].investi/anos[y].entrou:0)}</span></td></tr>`).join('')}</tbody></table></div></div>`;
  return {chart,table};
}

  h += `<div class="grid g2 section">` + [0,1].map(col=>`<div class="stack">${CATS.filter((_,i)=>i%2===col).map(c=>catBlock(o,c,t)).join('')}</div>`).join('') + `</div>`;

  </div>`;
  // histórico
  const ks = Object.keys(S.orc).sort().slice(-8);
  const ser = CATS.map(c=>({name:c.n,color:c.c,values:ks.map(k=>orcTotals(S.orc[k]).byCat[c.k]?.real||0)}));

  h += `<div class="actions section" style="justify-content:flex-end"><button class="btn ghost danger" data-act="apagar-mes">Apagar ${mLabel(mk).toLowerCase()}</button></div>`;
  return h;
}

const PTIPO = {limite:['A pagar','var(--bad)','bad'], guardado:['Dinheiro guardado','#1f3f8f','info'], recorrente:['Cai todo mês (não ocupa o limite todo)','var(--ink-2)','']};
function cartaoHead(right=''){
  const tabs=[['parcelas','Parcelas'],['contas','Contas no cartão'],['caixinha','Caixinha do cartão'],['compras','Compras do mês']];
  return head('Dia a dia','Cartão de crédito','Parcelas, contas fixas e o dinheiro guardado para pagar a fatura', right) +
    `<div class="chips" style="margin:-6px 0 18px">${tabs.map(([k,n])=>`<button class="chip" data-ctab="${k}" aria-pressed="${UI.cTab===k}">${n}</button>`).join('')}</div>`;
}
function vCartao(){
  if(UI.cTab==='compras') return vCompras();
  if(UI.cTab==='contas') return vContasCartao();
  if(UI.cTab==='caixinha') return vCaixinhaCartao();
  return vParcelas();
}
const parcRest = p => p.valores.slice(p.pagas);
function projecao(n){
  // próximas n faturas: parcelas que faltam + contas fixas
  const start=addMonth(thisMonth(),1); const ms=Array.from({length:n},(_,i)=>addMonth(start,i));
  const cards=[...new Set([...(S.cinfo.parcelas||[]).map(p=>p.cartao),...(S.cinfo.contas||[]).map(c=>c.cartao),...(S.cartao[thisMonth()]?.compras||[]).map(c=>c.cartao)])];
  const by={}; cards.forEach(c=>by[c]=ms.map(()=>0));
  (S.cinfo.parcelas||[]).forEach(p=>{ const r=parcRest(p), q=Math.max(1,+p.proxQtd||1); r.forEach((v,i)=>{ const mi=i<q?0:i-q+1; if(mi<n) by[p.cartao][mi]+=v; }); });
  const fora=((S.cinfo.fora||{})[ms[0]])||[];
  (S.cinfo.creditos||[]).forEach(c=>{ const i=ms.indexOf(c.mes); if(i>=0&&by[c.cartao]) by[c.cartao][i]-=+c.valor||0; });
  (S.cinfo.contas||[]).filter(c=>!c.parcelaId).forEach(c=>ms.forEach((_,i)=>{ if(!(i===0&&fora.includes(c.id))) by[c.cartao][i]+=+c.valor||0; }));
  (S.cartao[thisMonth()]?.compras||[]).filter(c=>!c.parcela).forEach(c=>{ if(!by[c.cartao]) by[c.cartao]=ms.map(()=>0); by[c.cartao][0]+=+c.valor||0; });
  return {ms,by,cards};
}
function composicaoFatura(card){
  // próxima fatura = próxima parcela de cada compra + contas no cartão + compras à vista do mês atual
  const it=[];
  const prox0=addMonth(thisMonth(),1), fora=((S.cinfo.fora||{})[prox0])||[];
  (S.cinfo.parcelas||[]).filter(p=>p.cartao===card&&p.pagas<p.valores.length).forEach(p=>{ const q=Math.max(1,+p.proxQtd||1); for(let k=0;k<q&&p.pagas+k<p.valores.length;k++) it.push({t:'Parcela',d:`${p.desc} ${p.pagas+k+1}/${p.valores.length}`,v:p.valores[p.pagas+k]}); });
  (S.cinfo.contas||[]).filter(c=>c.cartao===card&&!c.parcelaId).forEach(c=>it.push({t:'Conta',d:c.desc,v:fora.includes(c.id)?0:(+c.valor||0),cid:c.id,fora:fora.includes(c.id)}));
  (S.cartao[thisMonth()]?.compras||[]).filter(c=>c.cartao===card&&!c.parcela).forEach(c=>it.push({t:'Compra',d:c.desc,v:+c.valor||0}));
  const prox=addMonth(thisMonth(),1);
  (S.cinfo.creditos||[]).filter(c=>c.cartao===card&&c.mes===prox).forEach(c=>it.push({t:'Estorno',d:c.desc,v:-(+c.valor||0),id:c.id}));
  return {it,tot:r2(sum(it,x=>x.v))};
}
function faturasCard(){
  const prox=addMonth(thisMonth(),1), inf=(S.cinfo.faturas||{})[prox]||{};
  const cards=[...new Set([...(S.cinfo.parcelas||[]).map(p=>p.cartao),...(S.cinfo.contas||[]).map(c=>c.cartao)])];
  return `<div class="card section" style="margin-top:0;margin-bottom:14px"><div class="card-h"><div><h2>Fatura de ${MESES[+prox.slice(5)-1].toLowerCase()}</h2><p>Digite o valor que aparece no app do banco. O app confere com o que está lançado aqui.</p></div></div>
    <div class="grid g2">${cards.map(c=>{ const comp=composicaoFatura(c), real=inf[c], dif=real!=null?r2(real-comp.tot):null, ok=dif!=null&&Math.abs(dif)<=0.1;
      return `<div style="border:1px solid var(--line);border-radius:14px;padding:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="pill" style="background:${CARD_COLOR(c)};color:#fff;font-size:.8rem">${c==='MP'?'Mercado Pago':esc(c)}</span>
          ${dif==null?'<span class="pill">Informe a fatura</span>':ok?'<span class="pill good">Bate ✓</span>':`<span class="pill bad">Diferença de ${fmt(Math.abs(dif))}</span>`}</div>
        <div style="display:flex;gap:12px;margin-top:12px;align-items:flex-end;flex-wrap:wrap">
          <div class="field" style="margin:0;flex:1;min-width:130px"><label for="fat-${esc(c)}">Fatura no banco</label><input id="fat-${esc(c)}" inputmode="decimal" data-fatura="${esc(c)}" data-mes="${prox}" placeholder="0,00" value="${real!=null?r2(real).toLocaleString('pt-BR',{minimumFractionDigits:2}):''}" style="font-family:var(--display);font-weight:700;font-size:1.1rem"></div>
          <div class="stat" style="flex:1;min-width:130px"><div class="lbl">Calculado no app</div><div class="val sm">${fmt(comp.tot)}</div></div></div>
        ${dif!=null&&!ok?`<p style="margin:10px 0 0;font-size:.82rem" class="${dif<0?'neg':'neg'}">${dif<0?`O app somou ${fmt(-dif)} a mais que o banco. Confira se alguma compra ou conta abaixo ainda não caiu nesta fatura.`:`O banco cobrou ${fmt(dif)} a mais do que está lançado aqui. Pode faltar alguma compra.`}</p>`:''}
        <details style="margin-top:10px"><summary style="cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink-2)">Ver o que compõe (${comp.it.length} itens)</summary>
          <div class="rows" style="margin-top:6px">${comp.it.map(x=>`<div class="row" style="padding:6px 0;font-size:.86rem"><span class="pill ${x.t==='Estorno'?'good':''}" style="min-width:62px;justify-content:center">${x.t}</span><div class="grow">${esc(x.d)}</div><span class="v ${x.v<0?'pos':''}" style="${x.fora?'text-decoration:line-through;color:var(--muted)':''}">${fmt(x.fora?(S.cinfo.contas.find(c=>c.id===x.cid)||{}).valor:x.v)}</span>${x.cid?(x.fora?`<span class="pill bad" style="margin-left:6px">Fora desta fatura</span><button class="btn sm ghost" style="padding:3px 8px;font-size:.72rem" data-fora="${x.cid}">Desfazer</button>`:`<button class="iconbtn" style="margin-left:2px" data-fora="${x.cid}" aria-label="Tirar ${esc(x.d)} desta fatura" title="Tirar desta fatura (não caiu este mês)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`):''}${x.id?`<button class="iconbtn" aria-label="Apagar estorno" data-del-credito="${x.id}">${svg('trash')}</button>`:''}</div>`).join('')}</div></details>
        <button class="btn sm ghost" style="margin-top:6px;padding-left:0" data-act="novo-credito" data-cartao="${esc(c)}">${svg('plus')}Estorno ou crédito nesta fatura</button>
      </div>`; }).join('')}</div></div>`;
}
const CARD_COLOR = c => ({'Nubank':'#8a3ffc','MP':'#1fa7e0','C6':'#555'})[c] || 'var(--c2)';
function vParcelas(){
  const ps=S.cinfo.parcelas||[];
  let h=cartaoHead(`<button class="btn pri" data-act="nova-parcela">${svg('plus')}Nova compra parcelada</button>`) + faturasCard();
  const ativos=ps.filter(p=>p.pagas<p.valores.length), fim=ps.filter(p=>p.pagas>=p.valores.length);
  const falta=t=>sum(ativos.filter(p=>!t||p.tipo===t),p=>sum(parcRest(p)));
  const pj=projecao(12);
  const prox=sum(pj.cards,c=>pj.by[c][0]);
  h += `<div class="grid g4">
    <div class="card stat hero"><div class="lbl">Falta pagar</div><div class="val">${fmt(falta('limite'))}</div><div class="ft">Parcelas em vermelho</div></div>
    <div class="card stat"><div class="lbl">Já guardado</div><div class="val sm">${fmt(falta('guardado'))}</div><div class="ft">Parcelas com o dinheiro separado</div></div>
    <div class="card stat"><div class="lbl">Recorrentes</div><div class="val sm">${fmt(falta('recorrente'))}</div><div class="ft">Não ocupam o limite todo</div></div>
    <div class="card stat"><div class="lbl">Próxima fatura</div><div class="val sm">${fmt(prox)}</div><div class="ft">${mLabel(pj.ms[0])}: parcelas, contas e compras à vista</div></div>

        <div style="min-width:0"><div style="font-weight:700;font-size:1rem">${esc(p.desc)} <span class="pill" style="background:${CARD_COLOR(p.cartao)};color:#fff;margin-left:4px">${esc(p.cartao==='MP'?'Mercado Pago':p.cartao)}</span></div>
          <div class="muted" style="font-size:.8rem;margin-top:2px">${n}x de ${fmt(p.valores[n-1])} · total ${fmt(tot)}</div>${p.obs?`<div style="font-size:.8rem;margin-top:4px;color:var(--gold)">${esc(p.obs)}</div>`:''}</div>

        <span class="actions">${p.pagas>0?`<button class="btn sm ghost" data-parc="${p.id}" data-d="-1">Desfazer</button>`:''}${rest?`<button class="btn sm" data-parc="${p.id}" data-d="1">${(+p.proxQtd||1)>1?'Paguei '+p.proxQtd+' parcelas':'Paguei 1 parcela'}</button>`:''}<button class="btn sm ghost" data-act="editar-parcela" data-id="${p.id}">Editar</button></span></div>

  h += ativos.length?`<div class="grid g2 section">${[...ativos].sort((a,b)=>ord[a.tipo]-ord[b.tipo]||sum(parcRest(b))-sum(parcRest(a))).map(card).join('')}</div>`:`<div class="card empty section"><h3>Nenhuma parcela em aberto</h3><p>Cadastre as compras parceladas para ver quanto ainda falta pagar.</p></div>`;
  const ser=pj.cards.map(c=>({name:c==='MP'?'Mercado Pago':c,color:CARD_COLOR(c),values:pj.by[c]}));

  if(fim.length) h += `<div class="card section"><div class="card-h"><div><h2>Já quitadas</h2></div></div><div class="rows">${fim.map(p=>`<div class="row"><div class="grow"><div class="t">${esc(p.desc)}</div><div class="s">${esc(p.cartao)} · ${p.valores.length}x · total ${fmt(sum(p.valores))}</div></div><button class="btn sm ghost" data-act="editar-parcela" data-id="${p.id}">Editar</button></div>`).join('')}</div></div>`;

function vContasCartao(){

function vReserva(){

      </div>
    </div></div></div>`;
  // mês a mês, como na planilha

const CART_CLASSES = ['Renda fixa','Ações','FIIs','Cripto','Exterior'];
const ALVO_PADRAO = {'Renda fixa':55,'Ações':10,'FIIs':15,'Cripto':10,'Exterior':10};
function carteiraGrupo(p){
  // Como na planilha: reserva + investimentos formam a carteira; caixinhas de objetivos e "Outros" ficam à parte
  if(p.tipo==='cartao') return null;
  if(p.tipo==='caixinha' && !p.reserva) return 'Outros';
  if(p.classe==='Tesouro Direto') return 'Renda fixa';
  return CART_CLASSES.includes(p.classe) ? p.classe : 'Outros';
}
function donut(parts,total,center,sub){
  const r=70,c=2*Math.PI*r; let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*c; const seg=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" data-tip="${esc(p.k)}: ${esc(fmt(p.v))} (${esc(pct(p.v/total))})"/>`; off+=len; return seg;}).join('');
  return `<svg viewBox="0 0 180 180" style="width:190px;height:190px;flex:none">${segs}<text x="90" y="88" text-anchor="middle" font-family="var(--display)" font-size="14.5" font-weight="700" fill="var(--ink)">${esc(center)}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sub)}</text></svg>`;
}

function carteiraAtual(){
  const alvo = Object.assign({},ALVO_PADRAO,S.config.alvo||{});
  const g={}; CART_CLASSES.forEach(k=>g[k]=0);
  potesList().forEach(p=>{ const k=carteiraGrupo(p); if(k in g) g[k]+=potSaldo(p); });
  return {alvo,g,tot:sum(CART_CLASSES,k=>g[k])};
}
function simular(V){
  const {alvo,g,tot}=carteiraAtual(); const T=tot+V;
  const need={}; CART_CLASSES.forEach(k=>need[k]=Math.max(0,T*(+alvo[k]||0)/100-g[k]));
  const tn=sum(Object.values(need)); const out={};
  CART_CLASSES.forEach(k=>out[k]= tn>0 ? V*need[k]/tn : V*(+alvo[k]||0)/100);
  // arredonda para centavos mantendo a soma
  let acc=0; const ks=CART_CLASSES.filter(k=>out[k]>0.004); ks.forEach((k,i)=>{ out[k]= i===ks.length-1 ? r2(V-acc) : r2(out[k]); acc+=out[k]; });
  return {alvo,g,tot,T,out};
}
function simHtml(){
  const V=+UI.sim||0;
  if(V<=0){
    const {alvo,g,tot}=carteiraAtual();
    const L=CART_CLASSES.map(k=>({k,d:(tot?g[k]/tot*100:0)-(+alvo[k]||0)})).filter(x=>x.d<-0.5).sort((a,b)=>a.d-b.d);
    return L.length?`<p class="muted" style="margin:0;font-size:.86rem">Hoje estão abaixo do alvo: ${L.map(x=>`<b style="color:var(--ink)">${x.k==='Renda fixa'?'Renda Fixa':x.k}</b> (${x.d.toLocaleString('pt-BR',{maximumFractionDigits:1})} pontos)`).join(', ')}.</p>`:'<p class="muted" style="margin:0">Sua carteira está dentro do alvo.</p>';
  }
  const r=simular(V);
  const rows=CART_CLASSES.filter(k=>r.out[k]>0).sort((a,b)=>r.out[b]-r.out[a]);
  return `<div class="rows">${rows.map(k=>{const antes=r.tot?r.g[k]/r.tot:0, depois=(r.g[k]+r.out[k])/r.T; return `<div class="row" style="padding:8px 0"><i class="dot" style="background:${CLASS_COLOR[k]}"></i><div class="grow"><div class="t">${k==='Renda fixa'?'Renda Fixa':k}</div><div class="s">${pct(antes)} → <b style="color:var(--ink)">${pct(depois)}</b> · alvo ${r.alvo[k]}%</div></div><span class="v" style="font-size:1.05rem">${fmt(r.out[k])}</span></div>`;}).join('')}</div>
    <div class="actions" style="margin-top:10px;justify-content:space-between;align-items:center"><span class="muted" style="font-size:.8rem">Carteira vai para ${fmt(r.T)}</span><button class="btn pri sm" data-act="sim-registrar">Já investi, registrar</button></div>
    <p class="note">Conta feita com a sua sugestão de alocação. Não é recomendação de investimento.</p>`;
}

function assinaturaCalc(p){
  const ac=p.acomp||{}; const ms=Object.keys(ac).sort();
  const linhas=ms.map(m=>{ const rd=sum((p.movimentos||[]).filter(x=>x.tipo==='rendimento'&&x.data.startsWith(m)),x=>x.valor); const pg=+ac[m].pagou||0, cb=+ac[m].cashback||0; return {m,pg,rd,cb,res:rd+cb-pg}; });
  return {linhas, pagou:sum(linhas,l=>l.pg), rend:sum(linhas,l=>l.rd), cb:sum(linhas,l=>l.cb), saldo:sum(linhas,l=>l.res)};
}

  </div>`;

function openPote(id){

/* ================= forms ================= */
function modal(html, wide){
  const root=document.getElementById('modal-root');
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = root.querySelector('input,select,button:not([data-close])'); if(f) setTimeout(()=>f.focus(),20);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function form({title, fields, submit='Salvar', onSubmit, extra=''}){
  const fh = fields.map(f=>{
    if(f.type==='row') return `<div class="frow">${f.items.map(fieldHtml).join('')}</div>`;
    return fieldHtml(f);
  }).join('');
  modal(`<form id="frm"><h3>${esc(title)}</h3>${fh}${extra}<div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri" type="submit">${esc(submit)}</button></div></form>`);
  const frm = document.getElementById('frm');
  frm.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; e.preventDefault(); sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); sg.dataset.value=b.dataset.v; }));
  frm.addEventListener('submit', e=>{
    e.preventDefault();
    const v={}; frm.querySelectorAll('[name]').forEach(el=>v[el.name]= el.type==='checkbox'?el.checked:el.value);
    frm.querySelectorAll('.seg').forEach(sg=>v[sg.dataset.name]=sg.dataset.value);
    const err = onSubmit(v); if(err){ toast(err); return; }
    closeModal();
  });
}
function fieldHtml(f){
  const id='f-'+f.name;
  if(f.type==='select') return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" name="${f.name}">${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(val)===String(f.value)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select></div>`;
  if(f.type==='seg') return `<div class="field"><label>${esc(f.label)}</label><div class="seg" data-name="${f.name}" data-value="${esc(f.value)}">${f.options.map(([val,lab])=>`<button type="button" data-v="${val}" aria-pressed="${val===f.value}">${lab}</button>`).join('')}</div></div>`;
  if(f.type==='check') return `<label class="field" style="flex-direction:row;align-items:center;gap:8px;font-size:.86rem"><input type="checkbox" id="${id}" name="${f.name}" ${f.value?'checked':''} style="width:auto">${esc(f.label)}</label>`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label><input id="${id}" name="${f.name}" type="${f.type==='date'?'date':f.type==='month'?'month':'text'}" ${f.type==='money'?'inputmode="decimal" placeholder="0,00"':''} value="${esc(f.value??'')}" ${f.req?'required':''} autocomplete="off"></div>`;
}

const BACKUP_COLS = () => ({orcamento:S.orc, cartao:S.cartao, potes:S.potes, config:{geral:S.config}, meliuz:{registro:S.meliuz}, cartaoinfo:{geral:S.cinfo}, proventos:{lista:S.prov}, historico:{geral:S.hist}});
async function saveFile(name, txt){
  if (window.__saveFile) return window.__saveFile(name, txt);
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (!dl) throw {code:'unavailable'};
  return dl.save({filename:name, data:txt});
}
async function exportBackup(){
  const data = {app:'financas-rayssa', versao:1, exportadoEm:new Date().toISOString(), dados:BACKUP_COLS()};
  try { await saveFile('financas-backup-'+todayISO()+'.json', JSON.stringify(data,null,1)); toast('Backup salvo'); }
  catch(e){ if(e && e.code==='declined') return; toast('Não consegui salvar o arquivo aqui'); }
}
let pendingImport=null;
async function runImport(){
  const d=pendingImport; pendingImport=null; if(readonlyView()){ toast('Volte para a sua tela para importar'); return; } if(!d||!db){ toast('Sem conexão com o armazenamento'); return; }
  closeModal(); toast('Importando…'); let n=0;
  try { for (const [col,docs] of Object.entries(d)) for (const [id,body] of Object.entries(docs||{})) { if(body && typeof body==='object'){ await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(body))); n++; } } toast(n+' registros importados'); }
  catch(e){ toast('A importação parou no meio. Tente de novo.'); }
}

function initCasal(){
  const cp=window.__couple; C.on=true; C.me=cp.me.uid; C.meNome=cp.me.nome;

      pot(C.me); if (C.parc) pot(C.parc);

/* ---- visão do casal ---- */
function resumoPessoa(potes){
  const r={reserva:0,caixinhas:0,inv:{},invTot:0};
  Object.values(potes||{}).forEach(p=>{ const v=potSaldo(p); if(p.tipo==='cartao') return; if(p.reserva) r.reserva+=v; else if(p.tipo==='caixinha') r.caixinhas+=v; else { const k=p.classe||'Outros'; r.inv[k]=(r.inv[k]||0)+v; r.invTot+=v; } });
  r.total=r.reserva+r.caixinhas+r.invTot; return r;
}
function cxCasalList(){ return Object.entries(C.cpotes).map(([id,p])=>({id,...p})).sort((a,b)=>(a.ordem??99)-(b.ordem??99)||a.nome.localeCompare(b.nome)); }
function cxPorPessoa(p,uid){ return sum((p.movimentos||[]).filter(m=>m.quem===uid),m=>m.tipo==='resgate'?-m.valor:(m.tipo==='aporte'?m.valor:0)); }

      <div class="field section"><label for="codigo-casal">Código do convite</label><input id="codigo-casal" placeholder="EX.: 7K2MQ9XW4P" style="text-transform:uppercase;letter-spacing:.12em"></div>

    <p class="note">Nas caixinhas do casal, a coluna de cada um mostra quanto cada um guardou. Os rendimentos entram só no total.</p></div>`;
  h += `<div class="card section"><div class="card-h"><div><h2>Caixinhas do casal</h2><p>${cx.length} metas juntos</p></div><button class="btn sm pri" data-go="casal-cx">Ver caixinhas →</button></div>
    ${cx.length?`<div class="rows">${cx.map(p=>{const v=potSaldo(p),m=+p.meta||0; return `<div class="row"><i class="dot" style="background:${esc(p.cor)}"></i><div class="grow"><div class="t">${esc(p.nome)}</div>${m?`<div class="bar" style="margin-top:6px;height:6px"><i style="width:${Math.min(100,v/m*100)}%;background:${esc(p.cor)}"></i></div>`:''}</div><span class="muted num" style="font-size:.8rem">${m?pct(v/m)+' de '+fmt(m):''}</span><span class="v">${fmt(v)}</span></div>`;}).join('')}</div>`:`<div class="empty"><p>Nenhuma caixinha do casal ainda. Que tal começar pela próxima viagem?</p><button class="btn pri" data-act="nova-cx-casal">Criar caixinha do casal</button></div>`}</div>`;
  h += `<div class="actions section" style="justify-content:flex-end"><button class="btn ghost danger sm" data-act="sair-casal">Desfazer vínculo do casal</button></div>`;

  'entrar-casal'(){ const c=((document.getElementById('codigo-casal')||{}).value||'').trim().toUpperCase(); const n=((document.getElementById('meu-nome2')||{}).value||meuNome()).trim(); if(!c) return toast('Digite o código'); window.__couple.entrar(c,n).then(()=>toast('Vocês estão vinculados 💜')).catch(e=>toast(e&&e.code==='not-found'?'Código não encontrado':e&&e.code==='permission-denied'?'Esse convite já foi usado ou não existe':'Não consegui entrar: '+(e.message||e))); },
  'copiar-convite'(){ const t=C.cid; try{ navigator.clipboard.writeText(t).then(()=>toast('Código copiado'),()=>toast('Selecione o código e copie')); }catch(e){ toast('Selecione o código e copie'); } },
  'sair-casal'(){ modal(`<h3>Desfazer o vínculo?</h3><p class="sub">Vocês deixam de ver as telas um do outro. As caixinhas do casal continuam guardadas no convite, mas você perde o acesso a elas.</p><div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" style="background:var(--bad)" data-act="sair-casal-ok">Desfazer</button></div>`); },
  'sair-casal-ok'(){ window.__couple.sair(C.cid).then(()=>{ setPerfil('casal'); toast('Vínculo desfeito'); }).catch(()=>toast('Não consegui desfazer agora')); },
  'nova-cx-casal'(){ cxCasalForm(null); },
  'editar-cx-casal'(d){ cxCasalForm(d.id); },
  'mov-cx-casal'(d){ const p=C.cpotes[d.id];
    form({title:'Movimentar · '+p.nome, fields:[
      {name:'quem',label:'Quem',type:'seg',options:[[C.me,meuNome()],[C.parc,nomeParceiro()]],value:C.me},
      {name:'tipo',label:'Tipo',type:'seg',options:[['aporte','Guardar'],['resgate','Retirar'],['rendimento','Rendimento']],value:'aporte'},
      {type:'row',items:[{name:'valor',label:'Valor',type:'money',req:true},{name:'data',label:'Data',type:'date',value:todayISO()}]},
      {name:'obs',label:'Observação (opcional)'}],
    onSubmit:v=>{ const val=parseNum(v.valor); if(!val) return 'Informe um valor'; const q=JSON.parse(JSON.stringify(p)); q.movimentos=q.movimentos||[]; q.movimentos.push({id:uid('m'),data:v.data,tipo:v.tipo,valor:val,quem:v.quem,obs:v.obs.trim()}); saveCasal(d.id,q); setTimeout(()=>openCxCasal(d.id),30); toast('Salvo na caixinha do casal'); }});
  },
});
function cxCasalForm(id){
  const p = id ? C.cpotes[id] : {nome:'',meta:0,cor:POT_COLORS[Object.keys(C.cpotes).length%POT_COLORS.length]};
  form({title:id?'Editar '+p.nome:'Nova caixinha do casal', fields:[
    {name:'nome',label:'Nome (ex.: Viagem, Nossa casa, Casamento)',req:true,value:p.nome},
    {type:'row',items:[{name:'meta',label:'Meta (opcional)',type:'money',value:p.meta?r2(p.meta).toLocaleString('pt-BR',{minimumFractionDigits:2}):''},{name:'cor',label:'Cor',type:'select',options:POT_COLORS.map((c,i)=>[c,['Verde','Azul','Dourado','Roxo','Rosa','Laranja','Menta','Vermelho'][i]]),value:p.cor}]}],
  extra: id?`<div class="confirm"><span style="flex:1">Apagar esta caixinha do casal?</span><button type="button" class="btn sm danger" data-act="apagar-cx-casal" data-id="${id}">Apagar</button></div>`:'',
  onSubmit:v=>{ const q={...(id?JSON.parse(JSON.stringify(p)):{movimentos:[],ordem:Object.keys(C.cpotes).length}),nome:v.nome.trim(),meta:parseNum(v.meta),cor:v.cor}; const nid=id||uid('cx'); saveCasal(nid,q); toast(id?'Salvo':'Caixinha do casal criada'); }});
}
ACT['apagar-cx-casal']=d=>{ delete C.cpotes[d.id]; render(); window.__couple.casalDb(C.cid).collection('potes').doc(d.id).delete(); toast('Apagada'); };
/* ================= events ================= */
document.addEventListener('click', e=>{
  const t = e.target;
  const pf = t.closest('[data-perfil]'); if(pf){ document.getElementById('more').classList.remove('open'); setPerfil(pf.dataset.perfil); return; }
  const cxc = t.closest('[data-cxc]'); if(cxc){ openCxCasal(cxc.dataset.cxc); return; }
  const dmc = t.closest('[data-del-mov-casal]'); if(dmc){ const id=dmc.dataset.id; const q=JSON.parse(JSON.stringify(C.cpotes[id])); q.movimentos=q.movimentos.filter(m=>m.id!==dmc.dataset.delMovCasal); saveCasal(id,q); openCxCasal(id); return; }
  const goB = t.closest('[data-go]'); if(goB){ go(goB.dataset.go); return; }
  if(t.closest('[data-more]')){ document.getElementById('more').classList.toggle('open'); return; }
  if(t.id==='more'){ t.classList.remove('open'); return; }
  if(t.closest('[data-close]') || t.matches('[data-scrim]')){ closeModal(); return; }
  const mn = t.closest('[data-mnav]'); if(mn){ UI.month=addMonth(UI.month,+mn.dataset.mnav); render(); return; }
  const act = t.closest('[data-act]');
  if(act && readonlyView() && !['cores','backup','exportar','sair'].includes(act.dataset.act)){ toast('Só '+nomeParceiro()+' pode alterar'); return; }
  if(act){
    e.preventDefault();
    if(act.dataset.act==='apagar-pote'){ const id=act.dataset.pote; closeModal(); remove('potes',id); toast('Apagado'); return; }
    const inModal = act.closest('.sheet'); if(inModal && act.dataset.act!=='apagar-mes-ok') closeModal();
    ACT[act.dataset.act] && ACT[act.dataset.act]({...act.dataset}); return;
  }
  const pp = t.closest('[data-pal-pick]'); if(pp){ const k=pp.dataset.palPick; applyPal(k); save('config','geral',{...S.config,paleta:k}); ACT.cores(); toast('Cores: '+PALETTES[k].n); return; }
  const pt = t.closest('[data-pote]'); if(pt){ openPote(pt.dataset.pote); return; }
  const fo = t.closest('[data-fora]'); if(fo){ const m=addMonth(thisMonth(),1); const f=JSON.parse(JSON.stringify(S.cinfo.fora||{})); const l=f[m]||[]; const id=fo.dataset.fora; f[m]= l.includes(id)? l.filter(x=>x!==id) : [...l,id]; save('cartaoinfo','geral',{...S.cinfo,fora:f}); return; }
  const dca = t.closest('[data-del-compra-ativo]'); if(dca){ const id=dca.dataset.pote; const x=JSON.parse(JSON.stringify(S.potes[id])); const c=x.compras[+dca.dataset.delCompraAtivo]; x.compras.splice(+dca.dataset.delCompraAtivo,1); const mi=x.movimentos.findIndex(m=>m.data===c.data&&Math.abs(m.valor-c.valor)<0.005&&(m.tipo==='aporte'||m.tipo==='resgate')); if(mi>=0) x.movimentos.splice(mi,1); save('potes',id,x); openPote(id); return; }
  const dpv = t.closest('[data-del-prov]'); if(dpv){ save('proventos','lista',{...S.prov,itens:(S.prov.itens||[]).filter(x=>x.id!==dpv.dataset.delProv)}); return; }
  const dcr = t.closest('[data-del-credito]'); if(dcr){ save('cartaoinfo','geral',{...S.cinfo,creditos:(S.cinfo.creditos||[]).filter(x=>x.id!==dcr.dataset.delCredito)}); return; }
  if(t.closest('[data-provall]')){ UI.provAll=true; render(); return; }
  const ct = t.closest('[data-ctab]'); if(ct){ UI.cTab=ct.dataset.ctab; render(); return; }
  const pc = t.closest('[data-parc]'); if(pc){ const lst=(S.cinfo.parcelas||[]).map(x=>{ if(x.id!==pc.dataset.parc) return x; const d=+pc.dataset.d, q=d>0?Math.max(1,+x.proxQtd||1):1; return {...x,pagas:Math.max(0,Math.min(x.valores.length,x.pagas+d*q)),proxQtd:d>0?1:x.proxQtd}; }); save('cartaoinfo','geral',{...S.cinfo,parcelas:lst}); return; }
  const fl = t.closest('[data-filtro]'); if(fl){ UI.cartaoFiltro=fl.dataset.filtro; render(); return; }
  const ix = t.closest('[data-incx]'); if(ix){ UI.incluirCx = ix.dataset.incx==='1'; render(); return; }
  const di = t.closest('[data-del-item]'); if(di){ const o=ensureOrc(UI.month); o.itens=o.itens.filter(i=>i.id!==di.dataset.delItem); save('orcamento',UI.month,o); toast('Item apagado'); return; }
  const da = t.closest('[data-del-avulso]'); if(da){ const o=ensureOrc(UI.month); o.avulsos=(o.avulsos||[]).filter(i=>i.id!==da.dataset.delAvulso); save('orcamento',UI.month,o); return; }
  const dc = t.closest('[data-del-compra]'); if(dc){ const c=JSON.parse(JSON.stringify(S.cartao[UI.month])); c.compras=c.compras.filter(x=>x.id!==dc.dataset.delCompra); save('cartao',UI.month,c); toast('Compra apagada'); return; }
  const dm = t.closest('[data-del-mov]'); if(dm){ const id=dm.dataset.pote; const p=JSON.parse(JSON.stringify(S.potes[id])); p.movimentos=p.movimentos.filter(m=>m.id!==dm.dataset.delMov); save('potes',id,p); openPote(id); return; }
  const cs = t.closest('[data-cb-status]'); if(cs){ const nx={pendente:'confirmado',confirmado:'resgatado',resgatado:'pendente'}; const m={...S.meliuz,itens:S.meliuz.itens.map(x=>x.id===cs.dataset.cbStatus?{...x,status:nx[x.status]}:x)}; save('meliuz','registro',m); return; }
  const dcb = t.closest('[data-del-cb]'); if(dcb){ save('meliuz','registro',{...S.meliuz,itens:S.meliuz.itens.filter(x=>x.id!==dcb.dataset.delCb)}); return; }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.item){ const o=ensureOrc(UI.month); const it=o.itens.find(i=>i.id===t.dataset.item); if(!it) return; const f=t.dataset.f; const nv = f==='nome'? t.value.trim() : r2(parseNum(t.value)); if(it[f]===nv) return; it[f]=nv; save('orcamento',UI.month,o); return; }
  if(t.dataset.saldoPote){ const id=t.dataset.saldoPote, p=S.potes[id]; if(!p) return; const n=r2(parseNum(t.value)), diff=r2(n-potSaldo(p)); if(Math.abs(diff)<0.005) return;
    const q=JSON.parse(JSON.stringify(p)); q.movimentos=q.movimentos||[]; const aj = (p.classe==='Outros'||(p.tipo==='caixinha'&&!p.reserva&&false));
    q.movimentos.push({id:uid('m'),data:todayISO(),tipo:aj?'ajuste':'rendimento',valor:diff,obs:'Atualização de saldo'}); save('potes',id,q); toast(p.nome+': '+fmt(n)); return; }
  if(t.dataset.renda!==undefined && t.dataset.renda!==''){ const o=ensureOrc(UI.month); const r=o.rendas[+t.dataset.renda]; if(!r) return; const f=t.dataset.f; r[f]= f==='nome'?t.value.trim():r2(parseNum(t.value)); o.renda=r2(sum(o.rendas,x=>x.real)); o.rendaPrevista=r2(sum(o.rendas,x=>x.previsto)); save('orcamento',UI.month,o); return; }
  if(t.dataset.fatura){ const f=JSON.parse(JSON.stringify(S.cinfo.faturas||{})); const m=t.dataset.mes; f[m]=f[m]||{}; if(t.value.trim()==='') delete f[m][t.dataset.fatura]; else f[m][t.dataset.fatura]=r2(parseNum(t.value)); save('cartaoinfo','geral',{...S.cinfo,faturas:f}); return; }
  if(t.dataset.orcField){ const o=ensureOrc(UI.month); o[t.dataset.orcField]=r2(parseNum(t.value)); save('orcamento',UI.month,o); return; }
  if(t.dataset.cfg){ save('config','geral',{...S.config,[t.dataset.cfg]:r2(parseNum(t.value))}); }
});
document.addEventListener('change', async e=>{
  if(e.target.id!=='imp-file' || !e.target.files[0]) return;
  try{ const j=JSON.parse(await e.target.files[0].text()); const d=j.dados||j; if(!d.potes&&!d.orcamento) throw 0; pendingImport=d;
    const box=document.getElementById('imp-confirm'); box.innerHTML=`<div class="confirm"><span style="flex:1">Backup de ${esc((j.exportadoEm||'').slice(0,10).split('-').reverse().join('/')||'data desconhecida')}. Os dados com o mesmo nome serão substituídos.</span><button class="btn sm pri" data-act="importar-ok">Importar</button></div>`; }
  catch(err){ toast('Esse arquivo não é um backup do app'); }
});
document.addEventListener('input', e=>{ if(e.target.id==='sim-valor'){ UI.sim=parseNum(e.target.value); const r=document.getElementById('sim-res'); if(r) r.innerHTML=simHtml(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.classList.contains('cell-input')) e.target.blur();
});
// tooltips
const tip=document.getElementById('tip');
document.addEventListener('pointermove', e=>{ const el=e.target.closest && e.target.closest('[data-tip]'); if(el){ tip.textContent=el.dataset.tip; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1; } else tip.style.opacity=0; });

let toastT; function toast(msg){ let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2400); }

/* ================= render ================= */
function render(){
  const main=document.getElementById('main');
  if(S.ready<8 && !(UI.perfil==='casal')){ main.innerHTML=switchMobile()+'<div class="loading">Carregando…</div>'; return; }
  pickMonth();
  // keep focus on inline inputs across re-render
  const ae=document.activeElement; const key = ae && ae.id ? '#'+ae.id : (ae && ae.dataset && ae.dataset.item ? `[data-item="${ae.dataset.item}"][data-f="${ae.dataset.f}"]` : null);
  const V={inicio:vInicio,gastos:vGastos,cartao:vCartao,caixinhas:vCaixinhas,reserva:vReserva,investimentos:vInvest,rendimentos:vRend,carteira:vCarteira,meliuz:vMeliuz,casal:vCasal,'casal-cx':vCasalCx};
  if(UI.perfil==='casal' && !UI.view.startsWith('casal')) UI.view='casal';
  if(UI.perfil!=='casal' && UI.view.startsWith('casal')) UI.view='inicio';
  main.innerHTML = switchMobile() + (readonlyView()?`<div class="banner" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>👀 Você está vendo as finanças de <b>${esc(nomeParceiro())}</b>. Só ${esc(nomeParceiro())} pode alterar.</span><button class="btn sm" data-perfil="eu">Voltar para as minhas</button></div>`:'') + (V[UI.view]||vInicio)();
  if(key && main.contains(ae)===false){ const n=main.querySelector(key); if(n && document.getElementById('modal-root').children.length===0) n.focus(); }
}
boot();
</script>
